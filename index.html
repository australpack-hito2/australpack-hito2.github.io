/* ============ Impacto financiero y en el cliente ============ */
const money=n=>"$"+fN(Math.round(n||0));
const mm=n=>"$"+fN((n||0)/1e6,1)+" MM";
function ctxOf(p){
  const c={};
  if(p.code==="RECLAMO"){const r=(st.reclamos||[]).find(x=>"C"+x.id===p.key);c.cajas=r?r.cajas:0;}
  if(p.code==="RETENIDO"||p.code==="BLOQUEO"){const l=EV.lots.find(x=>x.code===p.lote);c.qty=l&&l.buenas!=null?l.buenas:0;}
  if(p.code==="ALERTA"&&p.res)c.min=Math.max(0,(p.res.t-p.t)/60000);
  return c;
}
function impacto(code,dec,c,P){
  P=P||st.params;c=c||{};dec=dec||"";
  const q=c.qty||0,k=c.cajas||0;
  switch(code){
    case "RECLAMO":
      if(/reposición/i.test(dec))return {costo:k*P.COSTO_CAJA+P.COSTO_DESPACHO,cliente:"Recibe "+fN(k)+" cajas nuevas en un despacho extra. Mientras tanto debe separar las cajas malas; si la reposición llega rápido, mantiene la confianza.",riesgo:"bajo"};
      if(/nota de crédito/i.test(dec))return {costo:k*P.PRECIO_CAJA,cliente:"Recibe un descuento, pero queda sin "+fN(k)+" cajas: puede faltarle embalaje para su producción.",riesgo:"medio"};
      if(/no procede/i.test(dec))return {costo:0,cliente:"No recibe compensación. Si el respaldo no es claro, puede molestarse y poner en duda la renovación del contrato.",riesgo:"alto"};
      return null;
    case "RETENIDO": case "BLOQUEO":
      if(/Separar/i.test(dec))return {costo:Math.round(q*0.04)*P.COSTO_CAJA+2*4*P.VALOR_HORA,cliente:"Recibe el pedido unas 4 horas después, solo con cajas conformes (se descarta cerca del 4 %).",riesgo:"bajo"};
      if(/completo/i.test(dec))return {costo:2*8*P.VALOR_HORA,cliente:"Recibe el pedido con cerca de 8 horas de atraso, revisado completo.",riesgo:"bajo"};
      if(/Rechazar|rechazado/i.test(dec))return {costo:q*P.COSTO_CAJA,cliente:"El pedido se atrasa al menos un día porque hay que fabricarlo de nuevo. Baja el indicador de entregas a tiempo.",riesgo:"medio"};
      if(/autorización escrita/i.test(dec))return {costo:0,cliente:"Recibe a tiempo, pero con un defecto que aceptó por escrito. Puede reclamar después.",riesgo:"medio"};
      if(/detenido/i.test(dec))return {costo:0,cliente:"Su pedido espera hasta que se resuelva la causa.",riesgo:"medio"};
      if(/reinspeccionado/i.test(dec))return {costo:2*4*P.VALOR_HORA,cliente:"Recibe el pedido con algunas horas de atraso.",riesgo:"bajo"};
      return null;
    case "ALERTA":
      if(/intervenir/i.test(dec)){const m=c.min!=null?c.min:45;return {costo:m/60*P.COSTO_HORA_PARADA,cliente:"Posible atraso corto del lote que estaba en la máquina; se evita una falla mayor y cajas defectuosas.",riesgo:"bajo"};}
      if(/programar/i.test(dec))return {costo:0.25*P.COSTO_HORA_PARADA,cliente:"Sin efecto si la intervención se hace en la pausa; si la falla avanza antes, puede detener la línea.",riesgo:"medio"};
      if(/Falsa/i.test(dec))return {costo:0,cliente:"Sin efecto. Si se repite, conviene ajustar los umbrales.",riesgo:"bajo"};
      return null;
    case "HUMEDAD":
      if(/Acondicionar/i.test(dec))return {costo:0.2*P.COSTO_HORA_PARADA,cliente:"Leve atraso del lote; baja el riesgo de cajas deformadas.",riesgo:"bajo"};
      if(/Usar con autorización/i.test(dec))return {costo:0,cliente:"Sin atraso, pero sube el riesgo de alabeo y de reclamo (como las cajas deformadas en frío).",riesgo:"alto"};
      if(/Devolver/i.test(dec))return {costo:P.COSTO_DESPACHO,cliente:"El pedido se atrasa hasta recibir papel nuevo.",riesgo:"medio"};
      return null;
    default:return null;
  }
}
const riskChip=r=>'<span class="chip '+(r==="alto"?"crit":r==="medio"?"warn":"ok")+'">riesgo '+r+"</span>";
function impHTML(im){
  if(!im)return '<span class="small muted">Sin costo directo relevante para esta decisión.</span>';
  return '<div class="imp"><span><b>Costo estimado:</b> '+money(im.costo)+"</span><span><b>Qué le pasa al cliente:</b> "+esc(im.cliente)+"</span><span>"+riskChip(im.riesgo)+"</span></div>";
}
function compareHTML(code,c){
  const rows=(OPC[code]||[]).map(o=>({o,im:impacto(code,o,c)})).filter(x=>x.im);
  if(!rows.length)return "";
  return '<details><summary>Comparar opciones: costo e impacto en el cliente</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th>Opción</th><th>Costo estimado</th><th>Qué le pasa al cliente</th><th>Riesgo</th></tr></thead><tbody>'+
   rows.map(x=>"<tr><td>"+esc(x.o)+'</td><td class="n">'+money(x.im.costo)+"</td><td>"+esc(x.im.cliente)+"</td><td>"+riskChip(x.im.riesgo)+"</td></tr>").join("")+
   '</tbody></table></div><p class="small muted">Costos calculados con los supuestos de Finanzas (Cómo funciona → Parámetros).</p></details>';
}

/* ============ Incidentes del mes (detalle para el informe) ============ */
function incHist(d){
  const r=rng(Math.floor(d.fecha/60000)),P=st.params,out=[],T=(h,m)=>d.fecha+(h*60+m)*60000,tu=h=>h<16?"A":"B";
  const H=()=>8+Math.floor(r()*15),M=()=>Math.floor(r()*60);
  for(let i=0;i<d.det;i++){const h=H(),min=30+Math.round(r()*35);out.push({t:T(h,M()),code:"ALERTA",sev:"crit",detalle:"Troqueladora: alerta DETENER (vibración "+fN(7.2+r()*1.2,1)+" mm/s)",decision:"Confirmada: intervenir ahora",quien:"Técnico de mantención turno "+tu(h),min,costo:min/60*P.COSTO_HORA_PARADA,sim:true});}
  for(let i=0;i<d.obs;i++){const h=H(),fa=i<d.falsas,min=15+Math.round(r()*25);out.push({t:T(h,M()),code:"ALERTA",sev:"warn",detalle:"Troqueladora: alerta OBSERVAR",decision:fa?"Falsa alarma":"Confirmada: programar en la próxima pausa",quien:"Técnico de mantención turno "+tu(h),min,costo:fa?0:0.25*P.COSTO_HORA_PARADA,sim:true});}
  for(let i=0;i<d.bloq;i++){const h=H(),q=9000+Math.round(r()*3000),dec="Separar cajas defectuosas y reinspeccionar";out.push({t:T(h,M()),code:"RETENIDO",sev:"crit",detalle:"Lote retenido en inspección ("+fN(q)+" cajas)",decision:dec,quien:"Jefa de Calidad",min:60+Math.round(r()*120),costo:impacto("RETENIDO",dec,{qty:q}).costo,sim:true});}
  if(d.humedad){const h=8+Math.floor(r()*8);out.push({t:T(h,M()),code:"HUMEDAD",sev:"warn",detalle:"Humedad alta del papel en recepción",decision:"Acondicionar el papel antes de corrugar",quien:"Jefa de Calidad",min:15+Math.round(r()*25),costo:impacto("HUMEDAD","Acondicionar",{}).costo,sim:true});}
  if(d.esperas){const h=H();out.push({t:T(h,M()),code:"ESPERA",sev:"warn",detalle:"Lote esperó más de 4 h entre etapas",decision:"Repriorizar en la programación",quien:"Jefe de producción",min:10+Math.round(r()*20),costo:0,sim:true});}
  if(d.reclamadas){const h=H(),dec="Historia del lote enviada y reposición de cajas";out.push({t:T(h,M()),code:"RECLAMO",sev:"crit",detalle:"Reclamo de cliente: "+fN(d.reclamadas)+" cajas",decision:dec,quien:"Jefa de Calidad",min:d.respRecl,costo:impacto("RECLAMO",dec,{cajas:d.reclamadas}).costo,sim:true});}
  if(d.reg-d.regOk>0){const h=H();out.push({t:T(h,M()),code:"ERROR",sev:"warn",detalle:(d.reg-d.regOk)+" registro(s) incompleto(s) al escanear",decision:"Corregido con un registro nuevo",quien:"Operador del turno",min:5+Math.round(r()*15),costo:0,sim:true});}
  return out;
}
function incidentes(){
  const H=[];historia().forEach(d=>incHist(d).forEach(x=>H.push(x)));
  const A=problemas().map(p=>{const im=p.res?impacto(p.code,p.res.decision,ctxOf(p)):null;
    return {t:p.t,code:p.code,sev:p.sev,detalle:p.detalle+" · "+p.titulo,decision:p.res?p.res.decision:"Abierto",quien:p.res?p.res.rol:"—",min:p.res?Math.max(0,(p.res.t-p.t)/60000):null,costo:im?im.costo:0,sim:false,open:!p.res};});
  return H.concat(A).sort((a,b)=>a.t-b.t);
}

/* ============ Escenarios (los tres que exige el caso + un techo de referencia) ============ */
const ESC={base:{n:"Base sin inversión",d:"La planta sigue como hoy y la demanda sube 18 %.",real:0,adop:0,sens:0,falsas:0},
 conservador:{n:"Propuesto conservador",d:"Se logra la estimación conservadora del informe (Tabla 3), con 96 % de registros y 98 % de sensores operativos.",real:1,adop:0.96,sens:0.98,falsas:0.15},
 falla:{n:"Falla o adopción parcial",d:"Se logra la mitad del efecto, falta el 30 % de los escaneos, fallan sensores y hay muchas falsas alarmas.",real:0.5,adop:0.70,sens:0.85,falsas:0.40},
 techo:{n:"Techo (suma sin ajuste)",d:"Solo como referencia: suma completa de A y C. El caso advierte que los efectos no son aditivos.",real:1,adop:0.98,sens:0.99,falsas:0.08}};
const ESC_KEYS=["base","conservador","falla","techo"];
/* Efectos por alternativa: hoja Alternativas_Caso2. Efecto principal = columna "Efecto principal" del documento del caso (p. 7). */
const EF_A={disp:8,ciclo:-0.4,scrap:-0.5,otif:1},EF_C={disp:2,ciclo:-0.8,scrap:-0.3,otif:5};
/* Hito 1: capacidad nominal 54.000 cajas/día, 2 turnos de 8 h, 22 días/mes, 890.000 cajas buenas/mes. */
const CAP_NOM=54000,DIAS_MES=22,PROD_C1=890000,DEM_MES=PROD_C1*1.18,DEM_DIA=DEM_MES/DIAS_MES;
const COSTO_A1=33.2e6,CAPACIT=62*4*3000,COSTO_TOT=COSTO_A1+CAPACIT; // dato del caso + capacitación (supuesto: 62 personas × 4 h × $3.000)
const cajasMes=(disp,scrap)=>CAP_NOM*disp/100*(1-scrap/100)*DIAS_MES;
function efectos(k,pr){
  if(k==="base")return {disp:0,ciclo:0,scrap:0,otif:0,fa:0,fc:0,pen:0};
  const fa=pr.real*Math.min(1,pr.sens/0.95),fc=pr.real*Math.min(1,pr.adop/0.95),pen=Math.max(0,pr.falsas-0.2)*5; // falsas alarmas sobre 20 %: paradas innecesarias
  if(k==="techo")return {disp:EF_A.disp*fa+EF_C.disp*fc-pen,ciclo:EF_A.ciclo*fa+EF_C.ciclo*fc,scrap:EF_A.scrap*fa+EF_C.scrap*fc,otif:EF_A.otif*fa+EF_C.otif*fc,fa,fc,pen};
  return {disp:EF_A.disp*fa-pen,ciclo:Math.min(EF_A.ciclo*fa,EF_C.ciclo*fc),scrap:0,otif:EF_C.otif*fc,fa,fc,pen}; // conservador: solo efecto principal, el mayor si se repite
}
function criterio(v,P){
  P=P||st.params;
  const z=(x,c,d,menor)=>x==null?"—":menor?(x<=c?"CONTINUAR":x<=d?"CORREGIR":"DETENER"):(x>=c?"CONTINUAR":x>=d?"CORREGIR":"DETENER");
  const items=[["Registros completos de lotes",v.reg,"%",z(v.reg,P.REG_CONT,P.REG_DET,false),"≥ "+P.REG_CONT+" %","< "+P.REG_DET+" %"],
   ["Falsas alarmas",v.falsas,"%",z(v.falsas,P.FALSAS_CONT,P.FALSAS_DET,true),"≤ "+P.FALSAS_CONT+" %","> "+P.FALSAS_DET+" %"],
   ["Disponibilidad de la troqueladora",v.disp,"%",z(v.disp,P.DISP_CONT,P.DISP_DET,false),"≥ "+P.DISP_CONT+" %","< "+P.DISP_DET+" %"],
   ["Tiempo para armar la historia de un lote",v.hist,"min",z(v.hist,P.HIST_CONT,P.HIST_DET,true),"≤ "+P.HIST_CONT+" min","> "+P.HIST_DET+" min"]];
  const zs=items.map(i=>i[3]),insp=v.insp!==false;
  const dec=!insp||zs.indexOf("DETENER")>=0?"DETENER EL PILOTO":zs.indexOf("CORREGIR")>=0?"CORREGIR Y CONTINUAR":"CONTINUAR Y ESCALAR";
  return {items,dec,insp};
}
function escParams(k){ui.escP=ui.escP||{};if(!ui.escP[k])ui.escP[k]=Object.assign({},ESC[k]);return ui.escP[k];}
function simEsc(k,pr,P){
  P=P||st.params;pr=pr||ESC[k];
  const b=k==="base",ef=efectos(k,pr),r=rng(777+ESC_KEYS.indexOf(k)*101),days=[];
  for(let i=0;i<22;i++){const ramp=b?0:Math.min(1,(i+1)/8),n=()=>r()-0.5;
    days.push({disp:BASE.disp+ef.disp*ramp+n()*2.4,ciclo:BASE.ciclo+ef.ciclo*ramp+n()*0.6,scrap:BASE.scrap+ef.scrap*ramp+n()*0.6,otif:BASE.otif+ef.otif*ramp+n()*3});}
  const res={days,ef,disp:BASE.disp+ef.disp,ciclo:BASE.ciclo+ef.ciclo,scrap:BASE.scrap+ef.scrap,otif:BASE.otif+ef.otif,recl:BASE.recl,
    reg:b?null:pr.adop*100,falsas:b?null:pr.falsas*100,hist:b?180:Math.round(5+(1-pr.adop)*200)};
  res.cap=cajasMes(res.disp,res.scrap);res.capBase=cajasMes(BASE.disp,BASE.scrap);
  res.cob=res.cap/DEM_MES*100;res.faltan=Math.max(0,DEM_MES-res.cap);
  res.extra=b?0:res.cap-res.capBase;
  res.umbral=res.extra>0?COSTO_TOT/(res.extra*12):null;
  const mg=P.PRECIO_CAJA-P.COSTO_CAJA;res.payback=res.extra>0&&mg>0?COSTO_TOT/(res.extra*mg):null;
  res.margenPerdido=b?res.faltan*mg:null;
  if(b){res.dec="Sin piloto";res.crit=null;}else{res.crit=criterio(res,P);res.dec=res.crit.dec;}
  return res;
}
function miniChart(days,key,o){
  const W=440,H=190,ml=40,mr=92,mt=12,mb=26,n=days.length,up=Math.min(o.upto,n);
  const x=i=>ml+i/(n-1)*(W-ml-mr),y=v=>mt+(1-(v-o.min)/(o.max-o.min))*(H-mt-mb);
  let g="";
  for(let v=o.min;v<=o.max+1e-9;v+=o.step)g+='<line class="ch-grid" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(v).toFixed(1)+'" y2="'+y(v).toFixed(1)+'"/><text class="ch-txt" x="'+(ml-6)+'" y="'+(y(v)+4).toFixed(1)+'" text-anchor="end">'+fN(v,o.dec)+"</text>";
  [0,7,14,21].forEach(i=>{g+='<text class="ch-txt" x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">día '+(i+1)+"</text>";});
  g+='<line class="ch-det" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(o.base).toFixed(1)+'" y2="'+y(o.base).toFixed(1)+'"/><text class="ch-det-t" x="'+(W-mr+6)+'" y="'+(y(o.base)+4).toFixed(1)+'">Hoy '+fN(o.base,1)+"</text>";
  g+='<line class="ch-obs" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(o.meta).toFixed(1)+'" y2="'+y(o.meta).toFixed(1)+'"/><text class="ch-obs-t" x="'+(W-mr+6)+'" y="'+(y(o.meta)+4).toFixed(1)+'">Meta '+fN(o.meta,1)+"</text>";
  if(up>0){const pts=days.slice(0,up).map((d,i)=>x(i).toFixed(1)+","+y(Math.max(o.min,Math.min(o.max,d[key]))).toFixed(1)).join(" ");
    g+='<polyline class="ch-line" points="'+pts+'"/>';const ld=days[up-1];g+='<circle class="pt-n pt-last" cx="'+x(up-1).toFixed(1)+'" cy="'+y(Math.max(o.min,Math.min(o.max,ld[key]))).toFixed(1)+'" r="5"/>';}
  return '<div class="chart-wrap"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+esc(o.lab)+' durante el mes simulado">'+g+"</svg></div>";
}
const speedCtl=()=>'<span class="speed" role="group" aria-label="Velocidad">'+[1,2,4].map(s=>'<button type="button" data-speed="'+s+'" aria-pressed="'+(ui.speed===s)+'">'+s+"x</button>").join("")+"</span>";

 {n:"fase 2 de 3 · los problemas se acumulan",d:"falla un sensor y aparece desgaste real en el rodamiento. Si nadie actúa, avanza.",drift:0.15,hum:0.15,nc:0.06,miss:0.08,sen:0.08,fa:0.08},
 {n:"fase 3 de 3 · problema grave",d:"el rodamiento falla, la troqueladora se detiene y un lote dañado puede llegar al cliente.",drift:1,hum:0.15,nc:0.06,miss:0.06,sen:0.03,fa:0.05}];

 HUM:[["acond","Acondicionar el papel","≈ 20 min de atraso del lote. Baja el riesgo de cajas deformadas."],["usar","Usar con autorización","Sin atraso, pero sube el riesgo de cajas deformadas en frío y de reclamo."]],
 RET:[["sep","Separar y reinspeccionar","Se descarta cerca del 4 % del lote y se atrasa unas 4 h."],["rechazar","Rechazar el lote","Se pierde el lote completo y se fabrica de nuevo: un día de atraso."]],
 MISS:[["ok","Completar el registro","5 min. La historia del lote queda completa."]],
 SEN:[["ok","Revisar el sensor","≈ 20 min del técnico; mientras, lecturas a mano cada 30 min."]],
 ALT:[["prog","Programar revisión","≈ 15 min en la próxima pausa. Si hay desgaste, se corrige a tiempo."],["falsa","Es falsa alarma","Sin costo si de verdad es falsa. Si era real, el desgaste sigue."]],
 RCL:[["resp","Responder con la ficha del lote","Reposición de cajas y respuesta con la historia del lote."]]};
const PTIPO={DET:"Máquina detenida",HUM:"Humedad alta",RET:"Lote retenido",MISS:"Escaneo faltante",SEN:"Falla de sensor",ALT:"Alerta OBSERVAR",RCL:"Reclamo del cliente"};
let plantTimer=null;
function plantNew(){return {running:false,t:D(8,0),k:0,kRun:0,fase:-1,n:0,lots:[],sent:[],done:0,rej:0,stops:0,stopMin:0,missed:0,alerts:0,log:[],pend:[],chain:[],vib:2.4,temp:55,corr:40,drift:0,state:"Normal",c1:0,c2:0,stopped:false,sensErr:false,blind:false,lastHum:null,flash:{},seq:0,costo:0,cajasPerd:0,recl:0,reclCajas:0};}
function plog(k,txt){const p=ui.plant;p.log.unshift({t:p.t,k,txt});if(p.log.length>40)p.log.pop();}
function ppend(type,txt,lot,block,x){
  const p=ui.plant,it=Object.assign({id:++p.seq,type,txt,lot,t:p.t,block},x||{});p.pend.push(it);
  p.chain.unshift({id:it.id,t:p.t,que:txt+(lot?" · "+lot:""),alerta:PTIPO[type]+" → avisa a "+rolesFor(type),res:null,imp:null,sev:block?"crit":"warn"});

function pchain(que,imp,sev){const p=ui.plant;p.chain.unshift({t:p.t,que,alerta:"Nadie respondió a tiempo",res:"—",imp,sev:sev||"crit"});if(p.chain.length>30)p.chain.pop();}
function plantStep(){
  const p=ui.plant,S=PL_ESC[ui.plantEsc]||PL_ESC.conservador,R=Math.random,P=st.params;
  p.t+=10*60000;p.k++;p.flash={};
  let E;
  if(p.quiet)E={drift:0,hum:0,nc:0,miss:0,sen:0,fa:0};
  else if(S.fases){const f=Math.min(2,Math.floor(p.kRun/FASE_PASOS));p.kRun++;
    if(f!==p.fase){p.fase=f;plog(f===2?"crit":"warn","Comienza la "+FASES[f].n+": "+FASES[f].d);if(f===2){if(!p.stopped)p.drift=Math.max(p.drift,5);
      const lx=p.lots.filter(l=>(l.stage===2||l.stage===3)&&!l.inc&&!l.wait)[0];
      if(lx){lx.inc=true;p.missed++;plog("crit","El lote "+lx.code+" no tiene su escaneo de impresión: si se troquela con vibración, Calidad no sabrá que debe reforzar la inspección.");ppend("MISS","Escaneo faltante en impresión",lx.code,false);}}}
    E=FASES[f];}
  else E=S;
  if(!p.lots.some(l=>l.stage===0)&&p.lots.length<8&&(p.n===0||R()<0.5)){p.n++;const cl=Object.keys(CLIENTES)[p.n%3];p.lots.push({code:"P-"+pad(p.n),cliente:cl,cajas:9000+Math.round(R()*3000),stage:0,left:ST_TICKS[0],wait:false,vib:false,risk:0,inc:false});}
  /* lo que nadie atendió a tiempo se agrava (solo en el escenario de falla) */
  if(S.fases&&!p.quiet)p.pend.forEach(it=>{
    if(it.esc||(p.t-it.t)/60000<60)return;
    if(it.type==="ALT"&&it.real&&p.drift){it.esc=true;p.drift+=2;plog("crit","La alerta OBSERVAR de las "+fT(it.t)+" lleva 60 min sin atender: el desgaste del rodamiento avanza.");pchain("Alerta OBSERVAR de las "+fT(it.t)+" sin atender por 60 min","El rodamiento se sigue desgastando: sube el riesgo de una detención larga.");}
    else if(it.type==="MISS"){it.esc=true;const l=p.lots.find(x=>x.code===it.lot);if(l)l.inc=true;plog("crit","El escaneo faltante de "+it.lot+" lleva 60 min sin completarse: la historia del lote queda incompleta.");pchain("“"+it.txt+"” de "+it.lot+" sin completar por 60 min","Historia incompleta: Calidad no sabrá si necesita inspección reforzada y, si el cliente reclama, la respuesta tardará horas.","warn");}
    else if(it.type==="SEN"){it.esc=true;p.blind=true;plog("crit","El sensor lleva 60 min sin revisión: la troqueladora trabaja a ciegas.");pchain("Falla de sensor sin revisar por 60 min","Nadie ve el desgaste de la troqueladora hasta que se rompe.");}
  });
  if(!p.stopped){
    if(!p.drift&&R()<E.drift)p.drift=1;
    if(p.drift)p.drift++;
    p.vib=Math.round((2.3+R()*0.6+p.drift*0.75)*10)/10;p.temp=Math.round(54+R()*4+p.drift*2.2);p.corr=Math.round(39+R()*3+p.drift*1.3);
    const lt=p.lots.find(l=>l.stage===3);
    if(p.blind&&p.drift>=9){p.stopped=true;p.stops++;p.alerts++;if(lt)lt.vib=true;p.grave=true;
      plog("crit","FALLA IMPREVISTA: el rodamiento se rompió sin aviso porque el sensor no se revisó. La troqueladora queda detenida."+(lt?" El lote "+lt.code+" se troqueló dañado.":""));
      ppend("DET","Falla imprevista de la troqueladora (sin aviso: sensor sin revisar)",lt?lt.code:null,true,{grave:true});}
    else if(p.blind||R()<E.sen){
      p.sensErr=true;
      if(!p.blind&&!p.pend.some(x=>x.type==="SEN")){plog("warn","Falla de sensor en la troqueladora: la lectura no se evalúa. Mantención debe revisarlo.");ppend("SEN","Falla de sensor en la troqueladora",null,false);}
    }else{
      p.sensErr=false;
      const L=Math.max(p.vib>=P.VIB_DET?2:p.vib>=P.VIB_OBS?1:0,p.temp>=P.TEMP_DET?2:p.temp>=P.TEMP_OBS?1:0,p.corr>=P.CORR_DET?2:p.corr>=P.CORR_OBS?1:0);
      if(L>=1){p.c1++;p.c2=L===2?p.c2+1:0;}else{p.c1=0;p.c2=0;}
      const conf=p.c2>=P.N_DET?"DETENER":p.c1>=P.N_OBS?"OBSERVAR":"Normal";
      if(conf!==p.state&&conf!=="Normal"){
        p.alerts++;
        if(conf==="DETENER"){p.stopped=true;p.stops++;if(lt)lt.vib=true;plog("crit","Troqueladora DETENIDA: vibración "+fN(p.vib,1)+" mm/s."+(lt?" El lote "+lt.code+" queda marcado para inspección reforzada.":"")+" Mantención debe validar para reanudar.");ppend("DET","Troqueladora detenida (vibración "+fN(p.vib,1)+" mm/s)",lt?lt.code:null,true);}
        else{if(lt)lt.vib=true;plog("warn","Alerta OBSERVAR en la troqueladora (vibración "+fN(p.vib,1)+" mm/s).");ppend("ALT","Alerta OBSERVAR en la troqueladora (vibración "+fN(p.vib,1)+" mm/s)",lt?lt.code:null,false,{real:true});}
      }
      p.state=conf;
      if(!p.drift&&R()<E.fa){p.alerts++;plog("warn","Alerta OBSERVAR sin causa aparente: posible falsa alarma.");ppend("ALT","Alerta OBSERVAR (posible falsa alarma)",null,false);}
    }
  } else p.stopMin+=10;
  /* reclamos de clientes por lotes que salieron con defecto */
  p.sent.filter(s=>s.due<=p.k).forEach(s=>{p.sent.splice(p.sent.indexOf(s),1);plog("crit","Reclamo de "+s.cliente+": "+s.cajas+" cajas "+s.motivo+" del lote "+s.code+".");ppend("RCL","Reclamo de "+s.cliente+": "+s.cajas+" cajas "+s.motivo,s.code,false,{cajas:s.cajas,inc:s.inc});});
  p.lots.sort((a,b)=>b.stage-a.stage);
  for(const l of p.lots.slice()){
    if(l.wait)continue;
    if(l.stage===3&&p.stopped)continue;
    l.left--;
    if(l.left>0)continue;
    const et=ETAPAS[l.stage];
    if(R()<E.miss){p.missed++;plog("warn","Escaneo faltante en "+et.toLowerCase()+" ("+l.code+"): el operador debe completar el registro.");ppend("MISS","Escaneo faltante en "+et.toLowerCase(),l.code,false);}
    else p.flash[l.stage]=l.code;
    if(l.stage===0){const h=Math.round((8.8+R()*1.6+(R()<E.hum?1.8:0))*10)/10;p.lastHum=h;
      if(h>P.HUM_ALERTA){l.wait=true;plog("warn","Humedad alta del papel ("+fN(h,1)+" %) en "+l.code+": el lote espera la decisión de Calidad.");ppend("HUM","Humedad alta del papel ("+fN(h,1)+" %)",l.code,true);continue;}}
    if(l.stage===5){const pnc=E.nc+(l.vib?(l.inc?0:0.6):0)+l.risk*0.5; // con la historia incompleta, Calidad no sabe que debe reforzar la inspección
      if(R()<pnc){l.wait=true;plog("crit","Inspección No conforme en "+l.code+(l.vib?" (se troqueló con vibración alta)":"")+": lote retenido. Calidad debe decidir.");ppend("RET","Lote retenido en inspección ("+fN(l.cajas)+" cajas)",l.code,true,{cajas:l.cajas});continue;}}
    if(l.stage===6){p.done++;plog("ok",l.code+" despachado a "+l.cliente+".");p.lots.splice(p.lots.indexOf(l),1);
      if(!p.quiet&&(l.vib||l.risk>0)&&R()<(S.fases?1:0.35))p.sent.push({code:l.code,cliente:l.cliente,inc:l.inc,due:p.k+3,motivo:l.risk>0?"deformadas en frío":"con medidas fuera de especificación",cajas:20+Math.round(R()*60)});
      continue;}
    l.stage++;l.left=ST_TICKS[l.stage];
  }
}

function plantResolve(id,opt){

  if(it.type==="DET"){const rep=it.grave?150:30;costo=(min+rep)/60*P.COSTO_HORA_PARADA;p.stopMin+=rep;p.stopped=false;p.drift=0;p.c1=0;p.c2=0;p.state="Normal";p.blind=false;p.sensErr=false;
    imp="Detenida "+(min+rep)+" min ("+min+" esperando a Mantención + "+rep+" de reparación"+(it.grave?", más larga porque se rompió sin aviso":"")+")"+(it.lot?". El lote "+it.lot+" pasa a inspección reforzada":"")+".";
    plog("ok",who+" validó la alerta y cambió el rodamiento. La troqueladora se reanuda.");}
  if(it.type==="HUM"){if(l){l.wait=false;if(opt==="usar")l.risk=0.5;else l.left=2;}
    if(opt==="usar")imp="Sin atraso, pero el lote "+it.lot+" queda con riesgo de deformarse en frío.";else{costo=0.2*P.COSTO_HORA_PARADA;imp="El lote "+it.lot+" se atrasa unos 20 min y baja el riesgo de deformación.";}
    plog("ok",who+" decidió "+lab.toLowerCase()+" en "+it.lot+".");}
  if(it.type==="RET"){const q=it.cajas||(l?l.cajas:10000);
    if(opt==="rechazar"){costo=q*P.COSTO_CAJA;p.cajasPerd+=q;if(l){p.lots.splice(p.lots.indexOf(l),1);}p.rej++;imp="Se pierden "+fN(q)+" cajas y el pedido se atrasa un día.";}
    else{const d=Math.round(q*0.04);costo=d*P.COSTO_CAJA+2*4*P.VALOR_HORA;p.cajasPerd+=d;if(l){l.wait=false;l.stage=6;l.left=2;l.vib=false;l.risk=0;}imp="Se descartan "+fN(d)+" cajas y el lote sale unas 4 h tarde, sin defectos.";}
    plog("ok",who+" decidió "+lab.toLowerCase()+" "+it.lot+".");}
  if(it.type==="MISS"){if(l)l.inc=false;imp=it.esc?"Se completó tarde: hubo un tramo sin historia.":"La historia del lote queda completa.";plog("ok",who+" completó el registro faltante de "+it.lot+".");}
  if(it.type==="SEN"){p.blind=false;p.sensErr=false;imp=it.esc?"La troqueladora estuvo a ciegas más de una hora.":"Sin efecto en la producción.";plog("ok",who+" revisó el sensor de la troqueladora.");}
  if(it.type==="ALT"){
    if(opt==="falsa"){if(p.drift){imp="Era una alerta real: el desgaste sigue y puede terminar en una detención.";plog("crit",who+" marcó como falsa una alerta real: el rodamiento se sigue desgastando.");}else{imp="Sin costo: no había falla.";plog("ok",who+" marcó la alerta como falsa alarma.");}}
    else{costo=0.25*P.COSTO_HORA_PARADA;imp=p.drift?"Se encontró desgaste real y se corrigió en la pausa: se evitó una detención.":"Revisión en la pausa: no había falla.";p.drift=0;plog("ok",who+" programó la revisión en la próxima pausa.");}}
  if(it.type==="RCL"){const c=it.cajas||40,t=it.inc?180:10;costo=c*P.COSTO_CAJA+P.COSTO_DESPACHO;p.recl++;p.reclCajas+=c;
    imp=(it.inc?"La historia del lote estaba incompleta: armar la respuesta tomó unas 3 h, como en el caso, y el cliente duda del control del proceso.":"Respuesta en unos "+t+" min con la historia completa del lote.")+" Se reponen "+fN(c)+" cajas.";
    plog(it.inc?"crit":"ok",who+" respondió el reclamo de "+it.lot+".");}
  p.costo+=costo;
  const ch=p.chain.find(c=>c.id===it.id);if(ch){ch.res=who+": "+lab+" ("+min+" min después)";ch.imp=imp+(costo?" Costo ≈ "+money(costo)+".":"");ch.sev=costo>1e6||/real|incompleta|ciegas|tarde/.test(imp)?"crit":"ok";}
  p.pend.splice(p.pend.indexOf(it),1);
  toast("Resuelto por "+who);render();
}

function flujoMeses(){const m=Array(12).fill(0);PAGOS.forEach(([s,,v])=>{m[Math.min(11,Math.floor((s-1)/4))]+=v;});return m.map(v=>v+SOPORTE_MES);}
function flujoSVG(m){
  const W=760,H=230,ml=46,mr=120,mt=14,mb=30,vmax=50e6,bw=(W-ml-mr)/12,y=v=>mt+(1-v/vmax)*(H-mt-mb);

  m.forEach((v,i)=>{acc+=v;const x=ml+i*bw+bw*0.2,w=bw*0.6;g+='<rect class="pt-n" x="'+x.toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(y(0)-y(v)).toFixed(1)+'" rx="2"><title>Mes '+(i+1)+": "+mm(v)+"</title></rect>"+
    (v>1e6?'<text class="ch-txt" x="'+(x+w/2).toFixed(1)+'" y="'+(y(v)-5).toFixed(1)+'" text-anchor="middle">'+fN(v/1e6,1)+"</text>":"")+'<text class="ch-txt" x="'+(x+w/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">M'+(i+1)+"</text>";pts.push((x+w/2).toFixed(1)+","+y(acc).toFixed(1));});
  g+='<polyline class="ch-line" points="'+pts.join(" ")+'"/><text class="ch-txt" x="'+(W-mr+6)+'" y="'+(y(acc)+4).toFixed(1)+'">Acumulado '+fN(acc/1e6,1)+"</text>";
  g+='<line class="ch-det" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(48e6)+'" y2="'+y(48e6)+'"/><text class="ch-det-t" x="'+(W-mr+6)+'" y="'+(y(48e6)+4)+'">Tope $48 MM</text>';

function respuesta(c,ev){
  ev=ev||EV;const P=st.params,l=ev.lots.find(x=>x.code===c.lote);if(!l)return null;
  const rp=l.ok.find(o=>o.etapa==="Recepción papel"),insp=l.ok.filter(o=>o.etapa==="Inspección").pop(),mal=l.mAlerts||[];
  const rechEt=et=>{const o=l.ok.find(x=>x.etapa===et);if(!o||o.rech==null)return null;const t=(o.cajas||0)+(o.rech||0);return t?o.rech/t*100:null;};
  const humAlta=rp&&rp.hum!=null&&rp.hum>P.HUM_ALERTA,m=c.motivo||"";
  let nivel="No identificada en el registro",causa="",acc=[],resp="Jefa de Calidad";
  const sinDesv="El lote se fabricó dentro de los parámetros registrados (humedad del papel "+(rp?fN(rp.hum,1)+" %":"sin dato")+", inspección "+(insp?insp.res.toLowerCase()+" con muestra de "+fN(insp.muestra)+" cajas":"sin dato")+"). ";
  if(/Deformación/i.test(m)){
    if(humAlta){nivel="Probable";causa="El papel entró con "+fN(rp.hum,1)+" % de humedad (límite "+fN(P.HUM_ALERTA,1)+" %). Con papel húmedo la caja pierde resistencia en frío.";}
    else if(mal.length){nivel="Posible";causa="El troquelado tuvo alertas de la troqueladora, que pueden debilitar los pliegues.";}
    else causa=sinDesv+"Se revisarán las cajas devueltas y las condiciones de transporte y de la cámara de frío.";
    acc=["Bloquear en recepción el papel sobre "+fN(P.HUM_ALERTA,1)+" % de humedad (hoy solo avisa).","Ensayo de compresión en frío a una muestra de los próximos 3 lotes del cliente.","Revisar con el cliente las condiciones de su cámara de frío."];
  }else if(/Medidas/i.test(m)){
    const rt=rechEt("Troquelado");
    if(mal.length){nivel="Probable";causa="El lote se troqueló con vibración alta en la troqueladora T-01: "+mal.map(a=>"alerta "+a.conf+" a las "+fT(a.t)+(a.val?" ("+a.val.decision.toLowerCase()+(a.val.accion?": "+a.val.accion.toLowerCase():"")+")":" (sin validar)")).join("; ")+"."+(rt!=null?" El rechazo en troquelado fue "+fP(rt)+".":"");}
    else if(rt!=null&&rt>P.RECH_MAX){nivel="Posible";causa="El rechazo en troquelado fue "+fP(rt)+", sobre el límite de "+P.RECH_MAX+" %.";}
    else causa=sinDesv+"Se medirán las cajas devueltas.";
    acc=["Cambiar el rodamiento cuando aparezca la alerta OBSERVAR, sin esperar a DETENER (mantención por condición).","Inspección reforzada obligatoria para todo lote troquelado durante una alerta.","Revisar el ajuste del troquel por formato con Mantención."];resp="Mantención + Jefa de Calidad";
  }else if(/Impresión/i.test(m)){
    const ri=rechEt("Impresión");
    if(ri!=null&&ri>P.RECH_MAX){nivel="Posible";causa="El rechazo en impresión fue "+fP(ri)+", sobre el límite.";}
    else causa=sinDesv+"La impresión tuvo "+(ri!=null?fP(ri):"—")+" de rechazo, bajo el límite de "+P.RECH_MAX+" %. Se revisarán las cajas devueltas.";
    acc=["Revisar ajuste y limpieza de la impresora I-01 al inicio de cada turno.","Agregar un control visual de impresión en la inspección del pallet."];resp="Jefe de Producción";
  }else if(/Pegado/i.test(m)){
    const rg=rechEt("Pegado");
    if(rg!=null&&rg>P.RECH_MAX){nivel="Posible";causa="El rechazo en pegado fue "+fP(rg)+", sobre el límite.";}else causa=sinDesv+"Se revisarán las cajas devueltas.";
    acc=["Revisar temperatura y cantidad de adhesivo de la pegadora P-01."];resp="Jefe de Producción";
  }else{nivel="Por investigar";causa=sinDesv+"Se analizará con el cliente.";acc=["Análisis conjunto con el cliente con las cajas devueltas."];}
  // contención: ¿otros lotes comparten la causa?
  const win=mal.length?[mal[0].t,Math.max.apply(null,mal.map(a=>a.val&&a.val.cierre?a.val.cierre:a.t))]:null;
  const cont=ev.lots.filter(x=>x.code!==l.code).map(x=>{const tq=x.ok.find(o=>o.etapa==="Troquelado"),rpx=x.ok.find(o=>o.etapa==="Recepción papel");
    let r="sin riesgo compartido";
    if(win&&tq&&tq.inicio<=win[1]&&(tq.fin==null||tq.fin>=win[0]))r="se troqueló durante la misma alerta: revisar";
    else if(win&&tq&&tq.inicio>win[1])r="se troqueló después de la reparación ("+fT(tq.inicio)+"): sin riesgo";
    if(/Deformación/i.test(m)&&rpx&&rpx.hum>P.HUM_ALERTA)r="también usó papel húmedo ("+fN(rpx.hum,1)+" %): revisar";
    return x.code+" ("+x.estado.toLowerCase()+"): "+r;});
  const errs=l.rs.filter(o=>!o.ok).length;
  const R=c.respuesta,min=R&&R.t!=null?Math.max(0,Math.round((R.t-c.t)/60000)):null;
  return {l,nivel,causa,acc,resp,cont,errs,min,R,insp,rp};
}

function fillRec(err){
  const sel=document.getElementById("rec-lote");const code=sel.value;
  const et=document.getElementById("rec-etapa").value;
  const l=EV.lots.find(x=>x.code===code);
  const prevQ=l&&l.buenas!=null?l.buenas:11000;
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.value=v;};
  set("rec-hum",et==="Recepción papel"?"9,6":"");
  if(et==="Inspección"){set("rec-res","Conforme");set("rec-mue","125");set("rec-def","");}
  const rech=et==="Despacho"||et==="Recepción papel"?0:Math.round(prevQ*0.006);
  set("rec-cajas",et==="Recepción papel"?"":String(et==="Corrugado"?11000:prevQ-rech));
  set("rec-rech",String(rech));
  set("rec-turno",err?"":turnoDe(fromIn(document.getElementById("rec-ini").value)||D(8,0)));
  set("rec-obs",err?"Ejemplo: el operador olvidó seleccionar el turno":"");
}

  if(!checkPin(pick,pin)){ui.fails[pick]=(ui.fails[pick]||0)+1;acceso(pick,"Clave incorrecta ("+ui.fails[pick]+" de "+MAX_FALLOS+")");
    if(ui.fails[pick]>=MAX_FALLOS){ui.lock[pick]=Date.now()+BLOQUEO_S*1000;ui.fails[pick]=0;acceso(pick,"Bloqueo "+BLOQUEO_S+" s por intentos fallidos");toast("Usuario bloqueado "+BLOQUEO_S+" s");setTimeout(()=>{if(ui.login)render();},BLOQUEO_S*1000+50);}
    else toast("Clave incorrecta");
    render();return;}
  if(ui.user&&ui.user!==pick)logout("Cambio de usuario");
  ui.fails[pick]=0;ui.user=pick;ui.role=u.rol;ui.login=false;ui.aud=null;ui.lastAct=Date.now();saveSession();acceso(pick,"Ingreso");render();toast("Ingresaste como "+u.nombre);
});
function copyFicha(){
  const l=EV.lots.find(x=>x.code===ui.lot);if(!l)return;
  const lines=["Ficha del lote "+l.code+" · "+l.cliente+" · "+l.formato,"Estado: "+l.estado,"Cajas: "+fN(l.inicial)+" al inicio · "+fN(l.buenas)+(l.despachado?" despachadas":" buenas")+" · merma "+fP(l.merma),"Ciclo: "+fH(l.ciclo),"","Etapa\tInicio\tTérmino\tEquipo\tTurno\tHumedad\tResultado\tCajas\tRechazadas\tValidación\tAlertas"];
  l.rs.forEach(o=>lines.push([o.etapa,fDT(o.inicio),o.fin!=null?fT(o.fin):"en curso",EQUIPO[o.etapa]||"",o.turno||"—",o.hum!=null?fN(o.hum,1):"",o.res||"",o.cajas!=null?o.cajas:"",o.rech!=null?o.rech:"",o.ok?"OK":o.valMsg,o.alerts.map(a=>a.t).join(" | ")].join("\t")));
  if(l.mAlerts.length){lines.push("","Alertas de la troqueladora");l.mAlerts.forEach(a=>lines.push(fT(a.t)+"\t"+a.conf+"\t"+(a.val?a.val.rol+" · "+a.val.decision+" · "+a.val.accion:"sin validar")));}
  const txt=lines.join("\n");
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.width="100%";ta.style.minHeight="160px";ta.setAttribute("aria-label","Ficha para copiar");const box=document.querySelector(".ficha-head .box");if(box){box.appendChild(ta);ta.focus();ta.select();}toast("Selecciona el texto y cópialo");};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Ficha copiada: se puede pegar en Excel o Word"),fallback);}catch(e){fallback();}
}

/* ============ Inicio ============ */
function fromHash(){
  let h="";try{h=decodeURIComponent((location.hash||"").slice(1));}catch(e){}
  if(!h)return;
  const lot=st.lotes.find(l=>l.code.toLowerCase()===h.toLowerCase());
  if(lot){ui.lot=lot.code;ui.tab="ficha";return;}
  if(TABS.some(([id])=>id===h))ui.tab=h;
}
loadSession();
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(ui.user)touch();},true));
setInterval(()=>{if(ui.user&&Date.now()-(ui.lastAct||0)>SES_MIN*60000){logout("Cierre por inactividad");ui.login=false;render();toast("Sesión cerrada por inactividad");}},15000);
try{ui.big=localStorage.getItem(STORE+"-big")==="1";}catch(e){}
plantWarm();
fromHash();
window.addEventListener("hashchange",()=>{fromHash();render();});
window.addEventListener("afterprint",()=>{document.body.classList.remove("pl-mode");document.body.classList.remove("pd-mode");});
render();
})();
