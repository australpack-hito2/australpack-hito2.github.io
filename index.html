<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitor de Planta AustralPack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: consola de planta. Barra superior fija con estado de la troqueladora y pestañas; cada vista en una columna;
   tarjetas solo para objetos reales (lotes, alertas, resultados de procesamiento). Etiquetas de lote imitan una etiqueta impresa sobre cartón. */
:root{
  --bg:#F1F4F5; --surface:#FFFFFF; --surface-2:#E7EDEF; --line:#CAD4D8; --line-strong:#9FB0B7;
  --fg:#12212A; --muted:#566A73; --accent:#0C5870; --accent-soft:#D3E8EF; --accent-fg:#FFFFFF;
  --kraft:#B0814A; --kraft-soft:#E9D7BE;
  --ok:#17663F; --ok-bg:#D8EFE2; --ok-solid:#1E8A54; --warn:#7A4D00; --warn-bg:#FBE5AE; --warn-solid:#D99A00;
  --crit:#A31C12; --crit-bg:#F8D5D0; --crit-solid:#C2291C; --crit-fg:#FFFFFF;
  --info:#24506A; --info-bg:#DCE7EE;
  --label-bg:#FFFFFF; --label-fg:#111111;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1518; --surface:#142027; --surface-2:#1B2A31; --line:#2A3C44; --line-strong:#47606A;
    --fg:#E3ECEF; --muted:#94A8AF; --accent:#62B6D2; --accent-soft:#173843; --accent-fg:#06222C;
    --kraft:#C99F6B; --kraft-soft:#3A2D1E;
    --ok:#73D3A0; --ok-bg:#123222; --ok-solid:#4CC383; --warn:#F2C35B; --warn-bg:#3A2C08; --warn-solid:#F2C35B;
    --crit:#FF8C7D; --crit-bg:#3D1712; --crit-solid:#E2493B; --crit-fg:#FFFFFF;
    --info:#9CC6DD; --info-bg:#18303D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1518; --surface:#142027; --surface-2:#1B2A31; --line:#2A3C44; --line-strong:#47606A;
  --fg:#E3ECEF; --muted:#94A8AF; --accent:#62B6D2; --accent-soft:#173843; --accent-fg:#06222C;
  --kraft:#C99F6B; --kraft-soft:#3A2D1E;
  --ok:#73D3A0; --ok-bg:#123222; --ok-solid:#4CC383; --warn:#F2C35B; --warn-bg:#3A2C08; --warn-solid:#F2C35B;
  --crit:#FF8C7D; --crit-bg:#3D1712; --crit-solid:#E2493B; --crit-fg:#FFFFFF;
  --info:#9CC6DD; --info-bg:#18303D;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h2{font-size:1.75rem;letter-spacing:.005em}
h3{font-size:1.3rem}
h4{font-size:1.08rem;letter-spacing:.01em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;border-radius:4px;border:1px solid var(--kraft);
  background:repeating-linear-gradient(90deg,var(--kraft) 0 3px,var(--kraft-soft) 3px 7px)}
.brand h1{font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.brand p{font-size:.78rem;color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
.tab{flex:none;border:0;background:none;padding:9px 12px 10px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;font-size:.92rem;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

/* contenido */
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 56px;display:flex;flex-direction:column;gap:26px}
.view-head{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.view-head p{color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;letter-spacing:.02em;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.crit-solid{background:var(--crit-solid);color:var(--crit-fg)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.chip.err{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.chip.wrap{white-space:normal;text-align:left;border-radius:10px;align-items:flex-start}
.chip.wrap::before{margin-top:6px;flex:none}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);padding:8px 14px;font-weight:600;font-size:.92rem;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:.84rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* formularios */
.form{display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:8px 10px}
.field textarea{min-height:60px;resize:vertical}
.field .hint{font-size:.76rem;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

/* procesamiento paso a paso */
.proc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:p}
.proc li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.proc li:first-child{border-top:0}
.proc li::before{counter-increment:p;content:counter(p);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--surface-2);color:var(--fg);border:1px solid var(--line-strong)}
.proc li.is-ok::before{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.proc li.is-err::before{background:var(--crit-bg);color:var(--crit);border-color:var(--crit)}
.proc li.is-warn::before{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.proc li.is-crit::before{background:var(--crit-solid);color:var(--crit-fg);border-color:var(--crit-solid)}
.proc .t{font-weight:700;font-size:.9rem}
.proc .d{font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.checks{display:flex;flex-direction:column;gap:4px}
.check{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem}
.meter{display:flex;gap:3px}
.meter span{width:22px;height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line-strong)}
.meter span.on{background:var(--warn-solid);border-color:var(--warn-solid)}
.meter.det span.on{background:var(--crit-solid);border-color:var(--crit-solid)}
.outcome{border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.outcome.ok{background:var(--ok-bg)}
.outcome.warn{background:var(--warn-bg)}
.outcome.crit{background:var(--crit-bg)}
.outcome.neutral{background:var(--surface-2)}
.outcome b{font-size:.95rem}

/* tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .k{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.78rem;color:var(--muted)}
.kpi.warn{border-color:var(--warn-solid)}
.kpi.crit{border-color:var(--crit-solid)}

/* lotes */
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.lot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0}
.lot:hover{border-color:var(--accent)}
.lot-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.85rem}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.stepper span{height:6px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.stepper span.done{background:var(--accent);border-color:var(--accent)}
.stepper span.cur{background:var(--accent-soft);border-color:var(--accent)}
.stepper span.bad{background:var(--crit-solid);border-color:var(--crit-solid)}
.stepper-l{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:.62rem;color:var(--muted);text-align:center;line-height:1.1}

/* etiqueta física */
.label{background:var(--label-bg);color:var(--label-fg);border:1px solid #9a7a52;border-left:8px solid var(--kraft);border-radius:3px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.label .co{font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#555}
.label .code{font-family:var(--f-mono);font-weight:600;font-size:1.15rem;letter-spacing:.02em;color:#111}
.label .meta{font-size:.74rem;color:#333;line-height:1.35}
.label .qr{width:76px;height:76px;display:grid;place-items:center;background:#fff}
.label .qr img,.label .qr canvas{width:76px!important;height:76px!important;image-rendering:pixelated}
.label .qr .noqr{font-size:.6rem;color:#555;text-align:center;border:1px dashed #999;width:76px;height:76px;display:grid;place-items:center;padding:4px}
.label.big .qr,.label.big .qr img,.label.big .qr canvas,.label.big .qr .noqr{width:110px!important;height:110px!important}

/* ficha */
.ficha-head{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.ficha-head{grid-template-columns:minmax(0,1fr)}}
.lot-picker{display:flex;gap:6px;flex-wrap:wrap}
.lot-picker button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-family:var(--f-mono);font-size:.84rem;cursor:pointer}
.lot-picker button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.q6{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.q h4{display:flex;align-items:baseline;gap:8px}
.q h4 .w{font-size:1.5rem;color:var(--accent)}
.q ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:.88rem}
.big-n{font-family:var(--f-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.82rem}
.flow span.st{border:1px solid var(--line-strong);border-radius:4px;padding:2px 6px;background:var(--surface-2)}
.flow span.ar{color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:94px 16px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative}
.timeline .tt{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);text-align:right;padding-top:1px}
.timeline .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--accent);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent);position:relative;z-index:1}
.timeline .dot.m{background:var(--warn-solid);box-shadow:0 0 0 1px var(--warn-solid)}
.timeline .dot.c{background:var(--crit-solid);box-shadow:0 0 0 1px var(--crit-solid)}
.timeline .dot.e{background:var(--surface);box-shadow:0 0 0 1px var(--crit)}
.timeline li::after{content:"";position:absolute;left:115px;top:14px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .body{display:flex;flex-direction:column;gap:4px;font-size:.88rem;min-width:0}
.timeline .body b{font-size:.94rem}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;font-size:.9rem}

/* gráfico */
.chart-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.chart-wrap svg{display:block;min-width:600px;width:100%;height:auto}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-txt{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.ch-area{fill:var(--accent-soft)}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.ch-obs{stroke:var(--warn-solid);stroke-width:1.5;stroke-dasharray:6 4}
.ch-det{stroke:var(--crit-solid);stroke-width:1.5;stroke-dasharray:6 4}
.ch-obs-t{fill:var(--warn);font-family:var(--f-mono);font-size:11px;font-weight:600}
.ch-det-t{fill:var(--crit);font-family:var(--f-mono);font-size:11px;font-weight:600}
.pt-n{fill:var(--accent)}
.pt-o{fill:var(--warn-solid)}
.pt-d{fill:var(--crit-solid)}
.pt-e{fill:none;stroke:var(--crit);stroke-width:1.6}
.pt-last{stroke:var(--surface);stroke-width:2}

/* gantt */
.gantt{min-width:680px;display:grid;grid-template-columns:minmax(200px,1.6fr) repeat(12,minmax(30px,1fr));font-size:.82rem}
.gantt .h{font-weight:700;color:var(--muted);text-align:center;padding:6px 0;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.74rem}
.gantt .h.l{text-align:left;padding-left:10px}
.gantt .task{padding:7px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.gantt .task small{color:var(--muted)}
.gantt .cell{border-bottom:1px solid var(--line);border-left:1px dashed var(--line);position:relative}
.gantt .bar{position:absolute;inset:9px 2px;border-radius:3px;background:var(--accent)}
.gantt .bar.soft{background:var(--accent-soft);border:1px solid var(--accent)}
.gantt .bar.stop{background:var(--crit-solid)}
.gantt .bar.mile{background:var(--warn-solid);inset:7px 30%;border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

.box.op{border:1px solid var(--accent)}
#op-panel,#proc-read,#proc-rec,#proc-recl{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 130px)}
@media (max-width:560px){#op-panel,#proc-read,#proc-rec,#proc-recl{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 200px)}}
.box.op .field input,.box.op .field select{padding:10px 12px}
@media (max-width:560px){.box.op .btn.primary{width:100%}}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.86rem}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard.crit{border-color:var(--crit-solid)}
.pcard.warn{border-color:var(--warn-solid)}
.pcard .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.chip{cursor:pointer;font-family:inherit}
.auto-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--ok)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.live::before{animation:pulse 1s ease-in-out infinite}@keyframes pulse{50%{opacity:.25}}}
.am{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.am>div{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.am>div+div{border-left:1px solid var(--line)}
.am h4{font-size:1.05rem}
.am ul{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
@media (max-width:640px){.am{grid-template-columns:minmax(0,1fr)}.am>div+div{border-left:0;border-top:1px solid var(--line)}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,15,20,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:660px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.role{border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.role span{font-size:.8rem;color:var(--muted)}
.role.on{border-color:var(--accent);background:var(--accent-soft)}
.imp{display:flex;flex-direction:column;gap:4px;font-size:.86rem;background:var(--surface-2);border-radius:var(--r);padding:8px 10px}

/* ============ Lógica (funciones puras) ============ */
function evaluate(st){
  const P=st.params;
  // --- registros de lotes (alternativa C) ---
  const recs=[...st.records].sort((a,b)=>a.inicio-b.inicio||a.id-b.id);
  const R=[];
  for(const r of recs){
    const e=Object.assign({},r,{alerts:[],espera:null,prevEtapa:null});
    let v="OK";
    if(!r.lote) v="Falta el código de lote";
    else if(!r.etapa) v="Falta la etapa";
    else if(r.inicio==null) v="Falta la hora de inicio";
    else if(!r.turno) v="Falta el turno";
    else if(r.fin!=null&&r.fin<r.inicio) v="La hora de término es anterior a la de inicio";
    else if(r.hum!=null&&(isNaN(r.hum)||r.hum<P.HUM_MIN||r.hum>P.HUM_MAX)) v="Humedad fuera del rango físico ("+P.HUM_MIN+"–"+P.HUM_MAX+" %)";
    else if(r.etapa==="Recepción papel"&&r.hum==null) v="Falta la humedad del papel";
    else if(r.etapa==="Inspección"&&!r.res) v="Falta el resultado de la inspección";
    else if((r.cajas!=null&&(isNaN(r.cajas)||r.cajas<0))||(r.rech!=null&&(isNaN(r.rech)||r.rech<0))) v="Cantidad de cajas no válida";
    e.ok=v==="OK"; e.valMsg=v;
    if(e.ok){
      const prev=R.filter(o=>o.ok&&o.lote===r.lote&&o.fin!=null&&o.fin<=r.inicio).sort((a,b)=>a.fin-b.fin).pop();
      if(prev){e.espera=(r.inicio-prev.fin)/3600000;e.prevEtapa=prev.etapa;}
      if(r.etapa==="Despacho"){
        const insp=R.some(o=>o.ok&&o.lote===r.lote&&o.etapa==="Inspección"&&o.res==="Conforme"&&o.fin!=null&&o.fin<=r.inicio);
        if(!insp) e.alerts.push({k:"crit",code:"BLOQUEO",t:"Despacho bloqueado: el lote no tiene una inspección conforme",resp:"Jefa de Calidad"});
      }
      if(r.res==="No conforme") e.alerts.push({k:"crit",code:"RETENIDO",t:"Lote retenido: no se despacha sin una nueva revisión conforme",resp:"Jefa de Calidad"});
      if(r.hum!=null&&r.hum>P.HUM_ALERTA) e.alerts.push({k:"warn",code:"HUMEDAD",t:"Humedad alta ("+fN(r.hum,1)+" %): acondicionar el papel antes de corrugar",resp:"Calidad + operador de recepción"});
      if(e.espera!=null&&e.espera>P.ESPERA_MAX) e.alerts.push({k:"warn",code:"ESPERA",t:"Esperó "+fH(e.espera)+" desde "+e.prevEtapa.toLowerCase()+": revisar la programación",resp:"Jefe de producción"});
      const tot=(r.cajas||0)+(r.rech||0);
      if(r.rech!=null&&tot>0&&r.rech/tot*100>P.RECH_MAX) e.alerts.push({k:"warn",code:"RECHAZO",t:"Rechazo alto en la etapa ("+fP(r.rech/tot*100)+"): revisar la causa",resp:"Jefe de producción + Calidad"});
    }
    R.push(e);
  }
  // --- lecturas de la troqueladora (alternativa A) ---
  const troq=R.filter(o=>o.ok&&o.etapa==="Troquelado");
  const reads=[...st.readings].sort((a,b)=>a.t-b.t||a.id-b.id);
  const S=[]; let c1=0,c2=0,prev="Normal";
  for(const s of reads){
    const e=Object.assign({},s);
    let v="OK";
    if([s.vib,s.temp,s.corr].some(x=>x==null||isNaN(x))) v="Falta un dato del sensor";
    else if(s.vib<P.VIB_MIN||s.vib>P.VIB_MAX||s.temp<P.TEMP_MIN||s.temp>P.TEMP_MAX||s.corr<P.CORR_MIN||s.corr>P.CORR_MAX) v="Valor fuera del rango físico del sensor";
    e.ok=v==="OK"; e.valMsg=v;
    const lv=(x,o,d)=>x>=d?2:x>=o?1:0;
    e.checks=[];
    if(e.ok){
      e.checks=[{n:"Vibración",u:"mm/s",x:s.vib,o:P.VIB_OBS,d:P.VIB_DET,l:lv(s.vib,P.VIB_OBS,P.VIB_DET),dec:1},
                {n:"Temperatura",u:"°C",x:s.temp,o:P.TEMP_OBS,d:P.TEMP_DET,l:lv(s.temp,P.TEMP_OBS,P.TEMP_DET),dec:0},
                {n:"Corriente",u:"A",x:s.corr,o:P.CORR_OBS,d:P.CORR_DET,l:lv(s.corr,P.CORR_OBS,P.CORR_DET),dec:0}];
      const L=Math.max.apply(null,e.checks.map(c=>c.l));
      e.estado=["Normal","OBSERVAR","DETENER"][L];
      if(L>=1){c1++;c2=L===2?c2+1:0;}else{c1=0;c2=0;}
    } else e.estado="SIN EVALUAR";
    e.c1=c1;e.c2=c2;
    e.conf=c2>=P.N_DET?"DETENER":c1>=P.N_OBS?"OBSERVAR":"Normal";
    e.isNew=e.conf!=="Normal"&&e.conf!==prev; prev=e.conf;
    const cand=troq.filter(o=>o.inicio<=s.t&&(o.fin==null||s.t<=o.fin)).sort((a,b)=>b.inicio-a.inicio)[0];
    e.lote=cand?cand.lote:null;
    if(!e.ok){e.accion="Revisar el sensor y anotar la lectura a mano en el formulario de contingencia";e.resp="Mantención";}
    else if(e.isNew&&e.conf==="DETENER"){e.accion="Detener la troqueladora, llamar a mantención y separar el lote para inspección reforzada";e.resp="Mantención + jefe de turno";}
    else if(e.isNew){e.accion="Revisar en terreno y programar la intervención en la próxima pausa";e.resp="Técnico de mantención del turno";}
    else if(e.conf!=="Normal"){e.accion="Alerta vigente: seguir el protocolo";e.resp=e.conf==="DETENER"?"Mantención + jefe de turno":"Técnico de mantención del turno";}
    else if(e.estado!=="Normal"){e.accion="Sin alarma: lectura aislada, se vigila la siguiente";e.resp="—";}
    else{e.accion="Sin acción";e.resp="—";}
    e.respMin=s.val&&s.val.cierre?Math.round((s.val.cierre-s.t)/60000):null;
    S.push(e);
  }
  // --- despacho bloqueado si el lote tuvo una alerta DETENER que Mantención no ha validado (paso manual obligatorio) ---
  R.filter(o=>o.ok&&o.etapa==="Despacho").forEach(o=>{
    const pend=S.some(x=>x.lote===o.lote&&x.isNew&&x.conf==="DETENER"&&!(x.val&&x.val.decision)&&x.t<=o.inicio);
    if(pend&&!o.alerts.some(a=>a.code==="BLOQUEO"))o.alerts.unshift({k:"crit",code:"BLOQUEO",t:"Despacho bloqueado: la alerta DETENER de la troqueladora en este lote no ha sido validada por Mantención",resp:"Mantención + Jefa de Calidad"});
  });
  // --- resumen por lote ---
  const lots=st.lotes.map(L=>{
    const rs=R.filter(o=>o.lote===L.code), ok=rs.filter(o=>o.ok);
    const withQ=ok.filter(o=>o.cajas!=null);
    const inicial=withQ.length?withQ[0].cajas+(withQ[0].rech||0):null;
    const desp=ok.filter(o=>o.etapa==="Despacho");
    const despOk=desp.find(o=>!o.alerts.some(a=>a.code==="BLOQUEO"));
    const insps=ok.filter(o=>o.etapa==="Inspección"), lastInsp=insps[insps.length-1];
    const lastDesp=desp[desp.length-1];
    const blocked=!despOk&&!!lastDesp&&lastDesp.alerts.some(a=>a.code==="BLOQUEO")&&!(lastInsp&&lastInsp.res==="Conforme"&&lastInsp.inicio>lastDesp.inicio&&!lastDesp.alerts.some(a=>a.t.indexOf("troqueladora")>=0));
    const retained=!!(lastInsp&&lastInsp.res==="No conforme");
    const last=ok[ok.length-1];
    let estado,estadoK;
    if(despOk){estado="Despachado";estadoK="ok";}
    else if(blocked){estado="Bloqueado";estadoK="crit-solid";}
    else if(retained){estado="Retenido";estadoK="crit";}
    else if(last){estado=last.fin==null?"En "+last.etapa.toLowerCase():"Espera tras "+last.etapa.toLowerCase();estadoK="info";}
    else{estado="Sin registros válidos";estadoK="neutral";}
    const buenas=despOk?despOk.cajas:(withQ.length?withQ[withQ.length-1].cajas:null);
    const merma=inicial&&buenas!=null?(inicial-buenas)/inicial*100:null;
    const rechTot=ok.reduce((a,o)=>a+(o.rech||0),0);
    const tStart=ok.length?ok[0].inicio:null;
    const tEnd=despOk?(despOk.fin||despOk.inicio):(ok.length?Math.max.apply(null,ok.map(o=>o.fin||o.inicio)):null);
    const ciclo=tStart!=null&&tEnd!=null?(tEnd-tStart)/3600000:null;
    const reads=S.filter(x=>x.lote===L.code), mAlerts=reads.filter(x=>x.isNew);
    const doneIdx=ETAPAS.map(et=>ok.filter(o=>o.etapa===et).pop()||null);
    const alerts=[];rs.forEach(o=>o.alerts.forEach(a=>alerts.push(Object.assign({},a,{rec:o}))));
    const tDesp=despOk?(despOk.fin||despOk.inicio):null;
    const aTiempo=L.compromiso!=null&&tDesp!=null&&tDesp<=L.compromiso;
    return Object.assign({},L,{rs,ok,inicial,buenas,merma,rechTot,ciclo,tDesp,aTiempo,despachado:!!despOk,blocked,retained,estado,estadoK,reads,mAlerts,doneIdx,alerts,errors:rs.filter(o=>!o.ok),last,tStart,tEnd});
  });
  // --- indicadores ---
  const k={};
  k.reg=R.length;k.regOk=R.filter(o=>o.ok).length;k.regPct=k.reg?k.regOk/k.reg*100:0;k.regErr=k.reg-k.regOk;
  k.lotes=lots.length;k.desp=lots.filter(l=>l.despachado).length;k.bloq=lots.filter(l=>l.blocked||l.retained).length;
  const dl=lots.filter(l=>l.despachado&&l.merma!=null);k.merma=dl.length?dl.reduce((a,l)=>a+l.merma,0)/dl.length:null;
  const dc=lots.filter(l=>l.despachado&&l.ciclo!=null);k.ciclo=dc.length?dc.reduce((a,l)=>a+l.ciclo,0)/dc.length:null;
  k.manual=R.filter(o=>o.origen==="Manual").length;
  k.alertsC=R.reduce((a,o)=>a+o.alerts.length,0);
  k.lect=S.length;k.lectErr=S.filter(x=>!x.ok).length;k.fuera=S.filter(x=>x.estado==="OBSERVAR"||x.estado==="DETENER").length;
  const na=S.filter(x=>x.isNew);k.alertas=na.length;k.validadas=na.filter(x=>x.val&&x.val.decision).length;k.sinVal=k.alertas-k.validadas;
  k.falsas=na.filter(x=>x.val&&x.val.decision==="Falsa alarma").length;k.falsasPct=k.alertas?k.falsas/k.alertas*100:0;
  const rt=na.filter(x=>x.respMin!=null);k.resp=rt.length?rt.reduce((a,x)=>a+x.respMin,0)/rt.length:null;
  const c1r=k.regPct>=P.REG_CONT?"CONTINUAR":k.regPct>=P.REG_DET?"CORREGIR":"DETENER";
  const c2r=k.falsasPct<=P.FALSAS_CONT?"CONTINUAR":k.falsasPct<=P.FALSAS_DET?"CORREGIR":"DETENER";
  const c3r=k.sinVal<=0?"CONTINUAR":k.sinVal<P.SINVAL_DET?"CORREGIR":"DETENER";
  k.crit=[c1r,c2r,c3r];k.decision=k.crit.includes("DETENER")?"DETENER EL PILOTO":k.crit.includes("CORREGIR")?"CORREGIR Y CONTINUAR":"CONTINUAR Y EVALUAR ESCALAMIENTO";
  const lastS=S[S.length-1]||null;
  return {R,S,lots,k,lastS};
}

/* ---- modo automático de la troqueladora ---- */
let autoTimer=null;
function pendingDet(){return EV.S.find(x=>x.isNew&&x.conf==="DETENER"&&!(x.val&&x.val.decision));}
function autoStop(msg){ui.auto=false;clearInterval(autoTimer);autoTimer=null;if(msg)ui.autoMsg=msg;}
function autoStart(){
  const pd=pendingDet();
  if(pd){ui.autoMsg="La troqueladora está detenida: Mantención debe validar la alerta DETENER de las "+fT(pd.t)+" para reanudar.";ui.selRead=pd.id;render();return;}
  ui.auto=true;ui.autoMsg="";clearInterval(autoTimer);autoTimer=setInterval(autoTick,2000/ui.speed);render();
}
function autoTick(){
  if(ui.tab!=="troqueladora"){autoStop();return;}
  const a=ui.autoState,rnd=Math.random,last=EV.lastS,t=(last?last.t:D(8,0))+30*60000;
  if(!a.drift&&rnd()<0.07)a.drift=1;
  let vib=Math.round((2.3+rnd()*0.6+(a.drift?a.drift*0.9:0))*10)/10;
  const temp=Math.round(54+rnd()*4+a.drift*2.5),corr=Math.round(39+rnd()*3+a.drift*1.5);
  if(a.drift)a.drift++;
  if(rnd()<0.04)vib=null;
  const r={id:st.nextId++,t,vib,temp,corr,turno:turnoDe(t),val:null,origen:"Sensor automático"};
  st.readings.push(r);ui.selRead=r.id;commit();
  const x=EV.S.find(z=>z.id===r.id);
  if(x&&x.isNew&&x.conf==="DETENER"){autoStop("Troqueladora detenida automáticamente: alerta DETENER confirmada a las "+fT(x.t)+". Para reanudar, Mantención debe validar la alerta. Este paso es manual.");toast("Alerta DETENER: se necesita validación de Mantención");}
  else if(x&&x.isNew)toast("Alerta OBSERVAR: queda pendiente para Mantención");
  else if(x&&!x.ok)toast("Falla de sensor: queda pendiente para Mantención");
  render();
}

  return '<div class="view-head"><span class="eyebrow">Alternativa C · Trazabilidad por QR</span><h2>Lotes en planta</h2><p>Cada caja lleva la etiqueta de su lote. Al escanear el QR con la cámara del celular se abre la ficha del lote. Aquí puedes tocar una tarjeta para simular el escaneo.</p></div>'+
  '<div class="lots">'+EV.lots.map(l=>{
    const nAl=l.alerts.length+l.mAlerts.length;
    return '<article class="lot" data-open-lot="'+esc(l.code)+'" tabindex="0" role="button" aria-label="Abrir ficha del lote '+esc(l.code)+'">'+labelHTML(l)+
      '<div class="lot-top">'+chipEstado(l)+'<span class="small muted">'+(nAl?nAl+" alerta"+(nAl>1?"s":""):"Sin alertas")+"</span></div>"+stepper(l)+
      '<dl class="facts"><dt>Cajas buenas</dt><dd>'+fN(l.buenas)+(l.despachado?" despachadas":"")+'</dd><dt>Merma</dt><dd>'+fP(l.merma)+(l.despachado?"":" hasta ahora")+'</dd><dt>Ciclo</dt><dd>'+fH(l.ciclo)+(l.despachado?"":" en curso")+"</dd></dl>"+
      '<span class="btn small primary">Abrir ficha</span></article>';
  }).join("")+"</div>"+
  '<div class="btn-row"><button class="btn" data-go-reg="__new">+ Crear un lote nuevo</button><button class="btn" data-action="print-labels">Imprimir etiquetas QR</button></div>'+
  '<p class="small muted">Datos simulados del 14-10-2026 para demostrar el funcionamiento. No son registros reales de la empresa.</p>';
}

function vFicha(){
  const l=EV.lots.find(x=>x.code===ui.lot)||EV.lots[0];
  if(!l)return"<p>No hay lotes.</p>";
  const picker='<div class="lot-picker" role="group" aria-label="Elegir lote">'+EV.lots.map(x=>'<button type="button" data-pick-lot="'+esc(x.code)+'" aria-pressed="'+(x.code===l.code)+'">'+esc(x.code)+"</button>").join("")+"</div>";
  const ok=l.ok;
  // ¿Qué?
  const qQue='<p><b>'+esc(l.formato)+'</b> para <b>'+esc(l.cliente)+'</b>.</p><p class="small muted">Lote '+esc(l.code)+" · iniciado el "+fD(l.tStart)+"</p>";
  // ¿Cuántas?
  const qRows=ok.filter(o=>o.cajas!=null).map(o=>"<li>"+esc(o.etapa)+": "+fN(o.cajas)+" buenas"+(o.rech?" · "+fN(o.rech)+" rechazadas":"")+"</li>").join("");
  const mermaOk=l.merma!=null&&l.merma<=st.params.MERMA_META;
  const qCuantas='<div style="display:flex;gap:18px;flex-wrap:wrap"><div><div class="big-n">'+fN(l.inicial)+'</div><div class="small muted">planchas al inicio</div></div><div><div class="big-n">'+fN(l.buenas)+'</div><div class="small muted">'+(l.despachado?"cajas despachadas":l.retained||l.blocked?"cajas retenidas":"cajas buenas hasta ahora")+'</div></div><div><div class="big-n">'+fP(l.merma)+'</div><div class="small muted">merma '+(l.despachado?"del lote":"hasta ahora")+" · meta ≤ "+fN(st.params.MERMA_META)+' %</div></div></div>'+
    (l.retained||l.blocked?'<p><span class="chip wrap crit">'+fN(l.buenas)+' cajas retenidas en revisión: podrían sumarse a la merma</span></p>':l.merma!=null?'<p>'+(mermaOk?'<span class="chip ok">Dentro de la meta</span>':'<span class="chip warn">Sobre la meta</span>')+"</p>":"")+(qRows?"<ul>"+qRows+"</ul>":"");
  // ¿Cómo?
  const rec=ok.find(o=>o.etapa==="Recepción papel");
  const insp=ok.filter(o=>o.etapa==="Inspección").pop();
  const vr=l.reads.filter(x=>x.ok);
  let como="<ul>";
  if(rec)como+="<li>Humedad del papel: <b>"+fN(rec.hum,1)+" %</b> "+(rec.hum>st.params.HUM_ALERTA?'<span class="chip warn">sobre '+fN(st.params.HUM_ALERTA)+" %</span>":'<span class="chip ok">bajo '+fN(st.params.HUM_ALERTA)+" %</span>")+"</li>";
  if(vr.length){const vv=vr.map(x=>x.vib);como+="<li>Troqueladora durante el lote: vibración entre <b>"+fN(Math.min.apply(null,vv),1)+"</b> y <b>"+fN(Math.max.apply(null,vv),1)+" mm/s</b> ("+vr.length+" lecturas)</li>";}
  l.mAlerts.forEach(a=>{como+="<li>Alerta "+chipConf(a.conf)+" a las "+fT(a.t)+(a.val&&a.val.accion?": "+esc(a.val.accion):": <b>sin validar</b>")+"</li>";});
  if(insp)como+="<li>Inspección: <b>"+esc(insp.res)+"</b>"+(insp.muestra?" con muestra de "+fN(insp.muestra)+" cajas":"")+(insp.defecto?" · defecto: "+esc(insp.defecto):"")+"</li>";
  else como+="<li>Inspección: aún no registrada</li>";
  const man=ok.filter(o=>o.origen==="Manual");
  if(man.length)como+="<li>"+man.length+" registro"+(man.length>1?"s":"")+" anotado"+(man.length>1?"s":"")+" en papel por contingencia ("+man.map(o=>esc(o.etapa)).join(", ")+")</li>";
  (st.reclamos||[]).filter(c=>c.lote===l.code).forEach(c=>{como+="<li>Reclamo del cliente ("+fDT(c.t)+"): "+fN(c.cajas)+" cajas por "+esc(c.motivo.toLowerCase())+" · "+(c.respuesta?"respondido en "+fN(Math.max(0,(c.respuesta.t-c.t)/60000))+" min":"<b>sin responder</b>")+"</li>";});
  if(l.errors.length)como+="<li>"+l.errors.length+" registro"+(l.errors.length>1?"s":"")+" con error de dato, conservado"+(l.errors.length>1?"s":"")+" sin borrar: "+l.errors.map(o=>esc(o.valMsg.toLowerCase())).join("; ")+"</li>";
  como+="</ul>";
  // ¿Dónde?
  const dondeFlow='<div class="flow">'+ok.filter((o,i,a)=>a.findIndex(z=>z.etapa===o.etapa)===i).map(o=>'<span class="st">'+esc(EQUIPO[o.etapa]||o.etapa)+"</span>").join('<span class="ar">→</span>')+(l.despachado?'<span class="ar">→</span><span class="st">'+esc(l.cliente)+"</span>":"")+"</div>";
  const qDonde=dondeFlow+'<p class="small muted">'+(l.despachado?"Destino: "+esc(l.cliente)+".":l.last?"Ubicación actual: "+esc(EQUIPO[l.last.etapa]||"")+".":"")+"</p>";
  // ¿Cuándo?
  const cicloOk=l.ciclo!=null&&l.ciclo<=st.params.CICLO_META;
  const esperas=ok.filter(o=>o.espera!=null&&o.espera>st.params.ESPERA_MAX);
  const qCuando='<div style="display:flex;gap:18px;flex-wrap:wrap"><div><div class="big-n">'+fT(l.tStart)+" – "+(l.despachado?fT(l.tEnd):"…")+'</div><div class="small muted">'+fD(l.tStart)+'</div></div><div><div class="big-n">'+fH(l.ciclo)+'</div><div class="small muted">ciclo '+(l.despachado?"total":"hasta ahora")+" · meta ≤ "+fN(st.params.CICLO_META,1)+" h</div></div></div>"+
    "<p>"+(l.despachado?(cicloOk?'<span class="chip ok">Dentro de la meta</span>':'<span class="chip warn">Sobre la meta</span>'):'<span class="chip info">En curso</span>')+"</p>"+
    (l.compromiso!=null?'<p class="small">Compromiso de entrega: <b>'+fDT(l.compromiso)+'</b> · '+(l.despachado?(l.aTiempo?'<span class="chip ok">despachado a tiempo ('+fT(l.tDesp)+')</span>':'<span class="chip warn">despachado '+Math.round((l.tDesp-l.compromiso)/60000)+' min tarde</span>'):'<span class="chip info">pendiente</span>')+'</p>':"")+
    (esperas.length?"<ul>"+esperas.map(o=>"<li>Esperó <b>"+fH(o.espera)+"</b> antes de "+esc(o.etapa.toLowerCase())+"</li>").join("")+"</ul>":'<p class="small muted">Sin esperas sobre '+fN(st.params.ESPERA_MAX)+" h entre etapas.</p>");
  // ¿Quién?
  let quien="<ul>"+ok.filter((o,i,a)=>a.findIndex(z=>z.etapa===o.etapa)===i).map(o=>"<li>"+esc(o.etapa)+": <b>"+esc(porDe(o))+"</b>, turno "+esc(o.turno)+(o.origen==="Manual"?" (en papel)":"")+"</li>").join("");
  l.mAlerts.forEach(a=>{quien+="<li>Alerta de las "+fT(a.t)+": "+(a.val&&a.val.rol?"validó <b>"+esc(a.val.rol)+"</b>":"<b>pendiente de validación</b>")+"</li>";});
  if(insp)quien+="<li>Inspección: Calidad, turno "+esc(insp.turno)+"</li>";
  l.alerts.forEach(a=>{quien+="<li>"+esc(a.t.split(":")[0])+": responde "+esc(a.resp)+"</li>";});
  quien+='</ul><p class="small muted">Se registra el turno y el rol, no el nombre de la persona. El registro sirve para entender qué pasó, no para culpar.</p>';

  // línea de tiempo
  const ev=[];
  l.rs.forEach(o=>ev.push({t:o.inicio,kind:o.ok?(o.alerts.some(a=>a.k!=="warn")?"c":(o.alerts.length?"m":"")):"e",o}));
  l.mAlerts.forEach(a=>ev.push({t:a.t,kind:a.conf==="DETENER"?"c":"m",a}));
  (st.reclamos||[]).filter(c=>c.lote===l.code).forEach(c=>ev.push({t:c.t,kind:"c",c}));
  ev.sort((a,b)=>a.t-b.t);
  const tl='<ol class="timeline">'+ev.map(x=>{
    if(x.c){const c=x.c;return '<li><span class="tt">'+fT(c.t)+'</span><span class="dot c"></span><div class="body"><b>Reclamo del cliente</b><span class="small">'+fN(c.cajas)+" cajas · "+esc(c.motivo)+(c.detalle?" · "+esc(c.detalle):"")+"</span>"+(c.respuesta?'<span class="small">'+esc(c.respuesta.rol)+" · "+esc(c.respuesta.decision)+" · en "+fN(Math.max(0,(c.respuesta.t-c.t)/60000))+" min</span>":'<span><span class="chip crit">Sin responder</span></span>')+"</div></li>";}
    if(x.a){const a=x.a;return '<li><span class="tt">'+fT(a.t)+'</span><span class="dot '+x.kind+'"></span><div class="body"><b>Troqueladora: alerta '+chipConf(a.conf)+'</b><span class="small">Vibración '+fN(a.vib,1)+" mm/s · temperatura "+fN(a.temp)+" °C · corriente "+fN(a.corr)+" A</span>"+(a.val?'<span class="small">'+esc(a.val.rol)+" · "+esc(a.val.decision)+(a.respMin!=null?" · cerrada en "+a.respMin+" min":"")+"</span>"+(a.val.accion?'<span class="small muted">'+esc(a.val.accion)+"</span>":""):'<span class="small"><span class="chip warn">Sin validar</span></span>')+"</div></li>";}
    const o=x.o;
    const det=[esc(EQUIPO[o.etapa]||""),"turno "+(o.turno?esc(o.turno):"—"),fT(o.inicio)+"–"+(o.fin!=null?fT(o.fin):"en curso"),"registró "+esc(porDe(o))];
    if(o.hum!=null)det.push("humedad "+fN(o.hum,1)+" %");
    if(o.res)det.push(esc(o.res)+(o.muestra?" (muestra "+fN(o.muestra)+")":""));
    if(o.cajas!=null)det.push(fN(o.cajas)+" cajas"+(o.rech?" · "+fN(o.rech)+" rech.":""));
    if(o.origen==="Manual")det.push("registro manual");
    return '<li><span class="tt">'+fT(o.inicio)+'</span><span class="dot '+x.kind+'"></span><div class="body"><b>'+esc(o.etapa)+"</b>"+'<span class="small">'+det.join(" · ")+"</span>"+(!o.ok?'<span><span class="chip err wrap">Error de dato: '+esc(o.valMsg)+"</span></span>":"")+o.alerts.map(a=>"<span>"+alertChip(a)+"</span>").join("")+(o.obs?'<span class="small muted">'+esc(o.obs)+"</span>":"")+"</div></li>";
  }).join("")+"</ol>";

  return '<div class="view-head"><span class="eyebrow">Lo que se ve al escanear el QR de la caja</span><h2>Ficha del lote</h2></div>'+picker+
  '<div class="ficha-head">'+labelHTML(l,true)+'<div class="box"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3 class="mono" style="font-family:var(--f-mono);font-size:1.25rem">'+esc(l.code)+"</h3>"+chipEstado(l)+"</div>"+
  (l.alerts.length||l.mAlerts.length?'<div class="btn-row">'+l.alerts.map(alertChip).join("")+"</div>":'<p class="small muted">Sin alertas en este lote.</p>')+
  (function(){const pp=problemas().filter(p=>!p.res&&p.lote===l.code);return pp.length?'<p><span class="chip crit">'+pp.length+" problema"+(pp.length>1?"s":"")+' por resolver</span> <button class="btn small ghost" data-tab="problemas">Resolver</button></p>':"";})()+
  '<p class="callout">Esta historia se armó al instante con lo que se registró en cada etapa. En la llamada del cliente, reconstruirla tomó más de 3 horas.</p>'+
  '<div class="btn-row"><a class="btn primary small" href="#op-panel" data-action="to-op">Registrar un paso de este lote</a><button class="btn small" data-action="copy-ficha">Copiar ficha</button></div></div></div>'+opPanel(l)+
  '<div class="q6">'+
   '<div class="q"><h4><span class="w">¿Qué?</span>Producto y cliente</h4>'+qQue+"</div>"+
   '<div class="q"><h4><span class="w">¿Cuántas?</span>Cantidades y merma</h4>'+qCuantas+"</div>"+
   '<div class="q"><h4><span class="w">¿Cómo?</span>Condiciones del proceso</h4>'+como+"</div>"+
   '<div class="q"><h4><span class="w">¿Dónde?</span>Máquinas y destino</h4>'+qDonde+"</div>"+
   '<div class="q"><h4><span class="w">¿Cuándo?</span>Horas y tiempo de ciclo</h4>'+qCuando+"</div>"+
   '<div class="q"><h4><span class="w">¿Quién?</span>Turnos y responsables</h4>'+quien+"</div>"+
  "</div>"+
  '<section><h3>Historia completa</h3>'+tl+"</section>";
}

function outcomeHTML(o){
  if(!o.ok)return '<div class="outcome crit"><b>Registro con error: '+esc(o.valMsg)+'</b><span class="small">Se guardó igual para no perder la evidencia. Corrígelo con un registro nuevo; el registro con error no se borra.</span></div>';
  if(!o.alerts.length)return '<div class="outcome ok"><b>Guardado sin alertas: el lote sigue su curso</b><span class="small">'+esc(o.etapa)+' · '+esc(porDe(o))+' · turno '+esc(o.turno)+' · '+fT(o.inicio)+'</span></div>';
  return o.alerts.map(a=>'<div class="outcome '+(a.k==="crit"?"crit":"warn")+'"><b>'+esc(a.t)+'</b><span class="small">Avisar a: '+esc(a.resp)+'</span></div>').join("");
}
function opPanel(l){
  const head='<div id="op-panel" class="box op"><span class="eyebrow">Modo operario · registro manual en el puesto</span><h3>Registrar un paso de '+esc(l.code)+'</h3>';
  const lastOp=ui.opLast!=null?EV.R.find(x=>x.id===ui.opLast&&x.lote===l.code):null;
  const res=lastOp?'<div id="op-result" class="list">'+outcomeHTML(lastOp)+'</div>':'';
  if(l.despachado)return head+res+'<p class="muted">Este lote ya fue despachado. No quedan etapas por registrar.</p></div>';
  const et=nextEtapa(l.code),start=defaultStart(l.code);
  const prevQ=l.buenas!=null?l.buenas:"";
  const autoRech=(et==="Despacho"||et==="Recepción papel"||prevQ==="")?0:Math.round(prevQ*0.006), autoQ=prevQ===""?"":(et==="Despacho"?prevQ:prevQ-autoRech);
  const hold=(l.retained||l.blocked)?'<p class="callout">Este lote está <b>retenido por Calidad</b>. Para poder despacharlo, primero Calidad debe registrar una <b>nueva inspección</b> con resultado <b>Conforme</b> (por ejemplo, después de separar las cajas con alabeo). Recién ahí el despacho se permite.</p>':'';
  return head+res+hold+'<p class="small muted">Al escanear la caja, el sistema completa solo la hora, el turno, el puesto, la máquina y las cantidades del contador. La persona revisa y confirma. Solo la inspección y los problemas exigen una decisión manual.</p>'+
  '<form id="form-op" class="form" novalidate data-lot="'+esc(l.code)+'" data-prevq="'+esc(prevQ)+'">'+
  '<div class="fgrid"><div class="field"><label for="op-por">¿Quién registra? (puesto)</label><select id="op-por">'+PUESTOS.map(x=>'<option'+(x===PUESTO[et]?" selected":"")+'>'+esc(x)+'</option>').join("")+'</select></div>'+
  '<div class="field"><label for="op-etapa">Etapa</label><select id="op-etapa">'+ETAPAS.map(e=>'<option'+(e===et?" selected":"")+'>'+esc(e)+'</option>').join("")+'</select><span class="hint" id="op-eq">'+esc(EQUIPO[et])+'</span></div>'+
  '<div class="field"><label for="op-turno">Turno</label><select id="op-turno"><option value="">Sin seleccionar</option><option'+(turnoDe(start)==="A"?" selected":"")+'>A</option><option'+(turnoDe(start)==="B"?" selected":"")+'>B</option></select></div></div>'+
  '<div class="fgrid"><div class="field" data-show="hum"><label for="op-hum">Humedad del papel (%)</label><input id="op-hum" inputmode="decimal" value="9,6"><span class="hint">Automático: higrómetro de recepción</span></div>'+
  '<div class="field" data-show="res"><label for="op-res">Resultado de inspección</label><select id="op-res"><option value="">Sin resultado</option><option>Conforme</option><option>No conforme</option></select><span class="hint">Manual: lo decide Calidad</span></div>'+
  '<div class="field" data-show="res"><label for="op-mue">Muestra revisada (cajas)</label><input id="op-mue" inputmode="numeric" value="125"></div>'+
  '<div class="field" data-show="res"><label for="op-def">Defecto observado</label><input id="op-def" placeholder="Ej: alabeo"></div>'+
  '<div class="field" data-show="qty"><label for="op-cajas">Cajas buenas</label><input id="op-cajas" inputmode="numeric" value="'+esc(autoQ)+'"><span class="hint">Automático: contador de la máquina</span></div>'+
  '<div class="field" data-show="rech"><label for="op-rech">Cajas rechazadas</label><input id="op-rech" inputmode="numeric" value="'+autoRech+'"><span class="hint">Automático: contador de la máquina</span></div></div>'+
  '<div class="field"><label for="op-obs">Observación</label><input id="op-obs" placeholder="Ej: se ajustó la presión del troquel"></div>'+
  '<details><summary>Cambiar hora o marcar como registro en papel</summary><div class="fgrid" style="margin-top:8px"><div class="field"><label for="op-ini">Inicio</label><input id="op-ini" type="datetime-local" value="'+toIn(start)+'"></div><div class="field"><label for="op-fin">Término</label><input id="op-fin" type="datetime-local" value="'+toIn(start+30*60000)+'"><span class="hint">Vacío = la etapa sigue en curso</span></div><div class="field"><label for="op-ori">Origen</label><select id="op-ori"><option>Sistema</option><option>Manual</option></select><span class="hint">Manual = se anotó en papel y se digita después</span></div></div></details>'+
  '<div class="btn-row"><button class="btn primary" type="submit">Guardar registro</button></div></form></div>';
}
function nextEtapa(code){
  const l=EV.lots.find(x=>x.code===code);if(!l||!l.last)return ETAPAS[0];
  if(l.retained||l.blocked)return "Inspección";
  if(l.last.fin==null)return l.last.etapa;
  const i=ETAPAS.indexOf(l.last.etapa);return ETAPAS[Math.min(i+1,ETAPAS.length-1)];
}
function defaultStart(code){
  const l=EV.lots.find(x=>x.code===code);
  const lastAny=Math.max.apply(null,st.records.map(r=>r.fin||r.inicio).concat([D(8,0)]));
  if(l&&l.last)return Math.max((l.last.fin||l.last.inicio)+10*60000,0);
  return lastAny+10*60000;
}
function vRegistrar(){
  const code=ui.regLot||ui.lot||EV.lots[0].code, isNew=code==="__new";
  const et=isNew?ETAPAS[0]:nextEtapa(code), start=isNew?Math.max.apply(null,st.records.map(r=>r.fin||r.inicio).concat([D(8,0)]))+10*60000:defaultStart(code);
  const lotOpts=EV.lots.map(l=>'<option value="'+esc(l.code)+'"'+(l.code===code?" selected":"")+">"+esc(l.code)+" · "+esc(l.cliente)+"</option>").join("")+'<option value="__new"'+(isNew?" selected":"")+'>+ Nuevo lote</option>';
  const etOpts=ETAPAS.map(e=>'<option'+(e===et?" selected":"")+">"+esc(e)+"</option>").join("");
  const cliOpts=Object.keys(CLIENTES).map(c=>"<option>"+esc(c)+"</option>").join("");
  const form='<form id="form-rec" class="form box" novalidate><h3>Escaneo en una etapa</h3><p class="small muted">Simula lo que hace el operador al escanear el QR del lote en su puesto.</p>'+
   '<div class="fgrid"><div class="field"><label for="rec-lote">Lote (código QR)</label><select id="rec-lote">'+lotOpts+'</select></div>'+
   '<div class="field"><label for="rec-etapa">Etapa</label><select id="rec-etapa">'+etOpts+'</select><span class="hint" id="rec-eq">'+esc(EQUIPO[et])+'</span></div>'+
   '<div class="field"><label for="rec-por">Registrado por (puesto)</label><select id="rec-por">'+PUESTOS.map(x=>'<option'+(x===PUESTO[et]?" selected":"")+'>'+esc(x)+'</option>').join("")+'</select></div></div>'+
   '<div class="fgrid" id="rec-new" hidden><div class="field"><label for="rec-cli">Cliente</label><select id="rec-cli">'+cliOpts+'</select></div><div class="field"><label for="rec-fmt">Formato</label><input id="rec-fmt" value="'+esc(CLIENTES["Frutos del Sur Export"])+'"></div></div>'+
   '<div class="fgrid"><div class="field"><label for="rec-ini">Inicio</label><input id="rec-ini" type="datetime-local" value="'+toIn(start)+'"></div>'+
   '<div class="field"><label for="rec-fin">Término</label><input id="rec-fin" type="datetime-local" value="'+toIn(start+30*60000)+'"><span class="hint">Vacío = la etapa sigue en curso</span></div>'+
   '<div class="field"><label for="rec-turno">Turno</label><select id="rec-turno"><option value="">Sin seleccionar</option><option'+(turnoDe(start)==="A"?" selected":"")+'>A</option><option'+(turnoDe(start)==="B"?" selected":"")+">B</option></select></div></div>"+
   '<div class="fgrid"><div class="field" data-show="hum"><label for="rec-hum">Humedad del papel (%)</label><input id="rec-hum" inputmode="decimal" placeholder="Ej: 9,5"></div>'+

   [...EV.R].reverse().map(o=>'<tr class="clickable" data-show-rec="'+o.id+'"><td class="n">'+fT(o.inicio)+'</td><td class="mono">'+esc(o.lote)+"</td><td>"+esc(o.etapa)+"</td><td>"+(o.turno?esc(o.turno):"—")+'</td><td class="n">'+(o.hum!=null?fN(o.hum,1):"")+"</td><td>"+esc(o.res||"")+'</td><td class="n">'+(o.cajas!=null?fN(o.cajas):"")+'</td><td class="n">'+(o.rech?fN(o.rech):"")+"</td><td>"+esc(o.origen)+"</td><td>"+(o.ok?'<span class="chip ok">OK</span>':'<span class="chip err">'+esc(o.valMsg)+"</span>")+"</td><td>"+(o.alerts.length?o.alerts.map(a=>'<span class="chip '+(a.code==="BLOQUEO"?"crit-solid":a.k)+'">'+esc(a.code==="BLOQUEO"?"Bloqueo":a.code==="RETENIDO"?"Retenido":a.code==="HUMEDAD"?"Humedad":a.code==="ESPERA"?"Espera":"Rechazo")+"</span>").join(" "):"")+"</td></tr>").join("")+

function procRec(){
  const id=ui.lastRec;const o=id!=null?EV.R.find(x=>x.id===id):null;
  if(!o)return '<div class="box"><h3>Cómo se procesa el escaneo</h3><p class="muted">Registra un paso (o toca una fila de la tabla) para ver aquí, paso a paso, cómo el sistema valida el dato, aplica las reglas y decide qué hacer.</p><ol class="proc"><li><span><span class="t">Dato que entra</span></span></li><li><span><span class="t">Validación</span></span></li><li><span><span class="t">Reglas revisadas</span></span></li><li><span><span class="t">Salida y responsable</span></span></li><li><span><span class="t">Registro en la ficha del lote</span></span></li></ol></div>';
  const P=st.params;
  const datos=[esc(o.lote),esc(o.etapa)+" en "+esc(EQUIPO[o.etapa]||"—"),"turno "+(o.turno?esc(o.turno):"<b>sin turno</b>"),fT(o.inicio)+"–"+(o.fin!=null?fT(o.fin):"en curso")];
  if(o.hum!=null)datos.push("humedad "+(isNaN(o.hum)?"no válida":fN(o.hum,1)+" %"));
  if(o.res)datos.push(esc(o.res));
  if(o.cajas!=null)datos.push(fN(o.cajas)+" cajas"+(o.rech!=null?" · "+fN(o.rech)+" rechazadas":""));
  datos.push("origen: "+esc(o.origen));
  let reglas="";
  if(o.ok){
    const rows=[];
    if(o.etapa==="Despacho"){const b=o.alerts.some(a=>a.code==="BLOQUEO");rows.push([b?"crit":"ok","¿Tiene inspección conforme antes del despacho? "+(b?"No → se bloquea":"Sí")]);}
    if(o.etapa==="Inspección")rows.push([o.res==="No conforme"?"crit":"ok","Resultado de inspección: "+esc(o.res)+(o.res==="No conforme"?" → lote retenido":"")]);
    if(o.hum!=null)rows.push([o.hum>P.HUM_ALERTA?"warn":"ok","Humedad "+fN(o.hum,1)+" % vs. límite "+fN(P.HUM_ALERTA)+" %"]);
    rows.push([o.espera!=null&&o.espera>P.ESPERA_MAX?"warn":"ok",o.espera!=null?"Espera desde "+esc(o.prevEtapa.toLowerCase())+": "+fH(o.espera)+" vs. máximo "+fN(P.ESPERA_MAX)+" h":"Primera etapa registrada del lote: no hay espera que medir"]);
    if(o.rech!=null&&o.cajas!=null&&o.cajas+o.rech>0){const p=o.rech/(o.cajas+o.rech)*100;rows.push([p>P.RECH_MAX?"warn":"ok","Rechazo en la etapa: "+fP(p)+" vs. máximo "+fN(P.RECH_MAX)+" %"]);}
    reglas='<div class="checks">'+rows.map(r=>'<div class="check"><span class="chip '+r[0]+'">'+(r[0]==="ok"?"OK":r[0]==="warn"?"Alerta":"Crítico")+"</span>"+r[1]+"</div>").join("")+"</div>";
  }
  const worst=o.alerts.some(a=>a.k==="crit")?"crit":o.alerts.length?"warn":"ok";
  const salida=!o.ok?'<div class="outcome crit"><b>Registro con error: '+esc(o.valMsg)+'</b><span class="small">Responsable: operador del turno. Se corrige con un registro nuevo; el registro con error no se borra.</span></div>':
    (o.alerts.length?o.alerts.map(a=>'<div class="outcome '+(a.k==="crit"?"crit":"warn")+'"><b>'+esc(a.t)+'</b><span class="small">Responsable: '+esc(a.resp)+"</span></div>").join(""):'<div class="outcome ok"><b>Sin alertas: el lote sigue su curso</b><span class="small">No se requiere acción.</span></div>');
  return '<div class="box"><h3>Cómo se procesó este escaneo</h3><ol class="proc">'+
    '<li class="is-ok"><div><span class="t">Dato que entra</span><div class="d">'+datos.join(" · ")+"</div></div></li>"+
    '<li class="'+(o.ok?"is-ok":"is-err")+'"><div><span class="t">Validación</span><div class="d">'+(o.ok?"OK: el registro está completo y los valores son posibles.":'<span><span class="chip err">ERROR</span> '+esc(o.valMsg)+".</span><span class=\"small muted\">Un dato con error no se evalúa ni se usa para calcular indicadores.</span>")+"</div></div></li>"+
    '<li class="'+(o.ok?(worst==="ok"?"is-ok":worst==="crit"?"is-crit":"is-warn"):"")+'"><div><span class="t">Reglas revisadas</span><div class="d">'+(o.ok?reglas:'<span class="muted">No se aplican: primero hay que corregir el dato.</span>')+"</div></div></li>"+
    '<li class="'+(o.ok?(worst==="ok"?"is-ok":worst==="crit"?"is-crit":"is-warn"):"is-err")+'"><div><span class="t">Salida y responsable</span><div class="d">'+salida+"</div></div></li>"+
    '<li class="is-ok"><div><span class="t">Registro en la ficha del lote</span><div class="d">Queda en la historia de '+esc(o.lote)+" con fecha, hora, equipo, turno y resultado."+'<span><button class="btn small" data-open-lot="'+esc(o.lote)+'">Ver ficha de '+esc(o.lote)+"</button></span></div></div></li></ol></div>";
}

function procRead(){
  const x=ui.selRead!=null?EV.S.find(s=>s.id===ui.selRead):null;
  if(!x)return '<div class="box"><h3>Cómo se procesa una lectura</h3><p class="muted">Registra una lectura (o toca una fila de la tabla) para ver aquí cómo el sistema pasa del dato a la decisión.</p><ol class="proc"><li><span><span class="t">Dato que entra</span></span></li><li><span><span class="t">Validación</span></span></li><li><span><span class="t">Comparación con umbrales</span></span></li><li><span><span class="t">Regla de confirmación</span></span></li><li><span><span class="t">Decisión</span></span></li><li><span><span class="t">Salida, responsable y registro</span></span></li></ol></div>';
  const P=st.params;
  const val=(v,d)=>v==null||isNaN(v)?"<b>sin dato</b>":fN(v,d);
  const lvlChip=l=>l===2?'<span class="chip crit-solid">DETENER</span>':l===1?'<span class="chip warn">OBSERVAR</span>':'<span class="chip ok">Normal</span>';
  const checks=x.ok?'<div class="checks">'+x.checks.map(c=>'<div class="check">'+lvlChip(c.l)+"<span>"+c.n+" <b>"+fN(c.x,c.dec)+" "+c.u+"</b> · observar desde "+fN(c.o,c.dec)+" · detener desde "+fN(c.d,c.dec)+"</span></div>").join("")+'</div><span class="small">Estado de la lectura: '+chipConf(x.estado)+"</span>":'<span class="muted">No se compara: el dato no es válido.</span>';
  const m=(n,k,cls)=>'<span class="meter'+(cls?" "+cls:"")+'">'+Array.from({length:k},(_,i)=>'<span class="'+(i<n?"on":"")+'"></span>').join("")+"</span>";
  const conf='<div class="check">'+m(Math.min(x.c1,P.N_OBS),P.N_OBS)+"<span>"+Math.min(x.c1,P.N_OBS)+" de "+P.N_OBS+" lecturas seguidas para confirmar OBSERVAR</span></div>"+
             '<div class="check">'+m(Math.min(x.c2,P.N_DET),P.N_DET,"det")+"<span>"+Math.min(x.c2,P.N_DET)+" de "+P.N_DET+" lecturas seguidas para confirmar DETENER</span></div>"+
             (!x.ok?'<span class="small muted">Una lectura inválida no suma ni reinicia el conteo.</span>':"");
  let decK,decT;
  if(!x.ok){decK="crit";decT="Lectura no evaluada: falla del dato";}
  else if(x.isNew){decK=x.conf==="DETENER"?"crit":"warn";decT="Alerta nueva "+x.conf+": se avisa al responsable";}
  else if(x.conf!=="Normal"){decK="warn";decT="Alerta "+x.conf+" sigue vigente";}
  else if(x.estado!=="Normal"){decK="neutral";decT="Sin alarma: es una lectura aislada y se vigila la siguiente";}
  else{decK="ok";decT="Todo normal";}
  let valForm="";
  if(x.isNew){
    const v=x.val||{};
    valForm='<form id="form-val" class="form" novalidate data-id="'+x.id+'" style="border-top:1px solid var(--line);padding-top:12px"><span class="t" style="font-weight:700">Validación de Mantención</span>'+
     '<div class="fgrid">'+(ui.user&&can("validarAlerta")?'<div class="field"><label for="val-rol">Validado por</label><input id="val-rol" value="'+esc(whoAmI())+'" readonly></div>':'<div class="field"><label for="val-rol">Validado por (rol)</label><select id="val-rol"><option value="">Elegir</option>'+ROLES.map(r=>"<option"+(v.rol===r?" selected":"")+">"+esc(r)+"</option>").join("")+'</select></div>')+
     '<div class="field"><label for="val-dec">Decisión</label><select id="val-dec"><option value="">Elegir</option>'+DECISIONES.map(r=>"<option"+(v.decision===r?" selected":"")+">"+esc(r)+"</option>").join("")+'</select></div>'+
     '<div class="field"><label for="val-cie">Hora de cierre</label><input id="val-cie" type="datetime-local" value="'+toIn(v.cierre||x.t+30*60000)+'"></div></div>'+
     '<div class="field"><label for="val-acc">Acción realizada</label><input id="val-acc" value="'+esc(v.accion||"")+'" placeholder="Ej: se revisó el eje y se cambió el rodamiento"></div>'+
     '<div class="btn-row"><button class="btn primary small" type="submit">Guardar validación</button>'+(x.respMin!=null?'<span class="small muted">Tiempo de respuesta: '+x.respMin+" min</span>":"")+"</div></form>";
  }
  return '<div class="box"><h3>Cómo se procesó la lectura de las '+fT(x.t)+'</h3><ol class="proc">'+
   '<li class="is-ok"><div><span class="t">Dato que entra</span><div class="d">Vibración '+val(x.vib,1)+" mm/s · temperatura "+val(x.temp,0)+" °C · corriente "+val(x.corr,0)+" A · turno "+esc(x.turno)+" · "+esc(x.origen||"Sensor automático")+"</div></div></li>"+
   '<li class="'+(x.ok?"is-ok":"is-err")+'"><div><span class="t">Validación</span><div class="d">'+(x.ok?"OK: los tres valores llegaron y están dentro del rango del sensor.":'<span><span class="chip err">ERROR</span> '+esc(x.valMsg)+".</span>")+"</div></div></li>"+
   '<li class="'+(!x.ok?"":x.estado==="DETENER"?"is-crit":x.estado==="OBSERVAR"?"is-warn":"is-ok")+'"><div><span class="t">Comparación con umbrales</span><div class="d">'+checks+"</div></div></li>"+
   '<li class="'+(x.conf==="DETENER"?"is-crit":x.conf==="OBSERVAR"?"is-warn":"is-ok")+'"><div><span class="t">Regla de confirmación</span><div class="d">'+conf+"</div></div></li>"+
   '<li class="'+(decK==="crit"?"is-crit":decK==="warn"?"is-warn":"is-ok")+'"><div><span class="t">Decisión</span><div class="d"><div class="outcome '+decK+'"><b>'+esc(decT)+"</b></div></div></div></li>"+
   '<li class="is-ok"><div><span class="t">Salida, responsable y registro</span><div class="d"><span><b>Acción:</b> '+esc(x.accion)+"</span><span><b>Responsable:</b> "+esc(x.resp)+"</span><span><b>Lote en la máquina:</b> "+(x.lote?'<button class="btn small" data-open-lot="'+esc(x.lote)+'">'+esc(x.lote)+"</button>":"ninguno en ese momento")+'</span><span class="small muted">Registrado el '+fDT(x.t)+".</span>"+valForm+"</div></div></li></ol></div>";
}
function chartSVG(){
  const pts=EV.S;if(!pts.length)return'<p class="muted">Sin lecturas.</p>';
  const P=st.params,W=760,H=260,ml=44,mr=86,mt=14,mb=34;
  const t0=pts[0].t,t1=pts[pts.length-1].t,span=Math.max(t1-t0,3600000);
  const vv=pts.filter(p=>p.ok).map(p=>p.vib);
  let vmax=Math.max(10,P.VIB_DET+2,vv.length?Math.max.apply(null,vv)+1:0);vmax=Math.ceil(vmax/2)*2;
  const step=vmax<=12?2:Math.ceil(vmax/6);
  const x=t=>ml+(t-t0)/span*(W-ml-mr),y=v=>mt+(1-v/vmax)*(H-mt-mb);
  let g="";
  for(let v=0;v<=vmax;v+=step){g+='<line class="ch-grid" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="ch-txt" x="'+(ml-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fN(v)+"</text>";}
  const h0=new Date(t0);h0.setMinutes(0,0,0);
  for(let t=h0.getTime();t<=t1;t+=3600000){if(t<t0)continue;const hr=new Date(t).getHours();if(hr%2)continue;g+='<line class="ch-grid" x1="'+x(t)+'" x2="'+x(t)+'" y1="'+(H-mb)+'" y2="'+(H-mb+5)+'"/><text class="ch-txt" x="'+x(t)+'" y="'+(H-mb+18)+'" text-anchor="middle">'+pad(hr)+":00</text>";}
  g+='<text class="ch-txt" x="'+(ml-8)+'" y="'+(mt-2)+'" text-anchor="end">mm/s</text>';
  // segmentos
  const segs=[];let cur=[];pts.forEach(p=>{if(p.ok){cur.push(p);}else{if(cur.length)segs.push(cur);cur=[];}});if(cur.length)segs.push(cur);
  let area="",line="";
  segs.forEach(s=>{const d=s.map(p=>x(p.t).toFixed(1)+","+y(p.vib).toFixed(1)).join(" ");line+='<polyline class="ch-line" points="'+d+'"/>';if(s.length>1)area+='<polygon class="ch-area" points="'+x(s[0].t).toFixed(1)+","+y(0)+" "+d+" "+x(s[s.length-1].t).toFixed(1)+","+y(0)+'"/>';});
  const th='<line class="ch-obs" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(P.VIB_OBS)+'" y2="'+y(P.VIB_OBS)+'"/><text class="ch-obs-t" x="'+(W-mr+6)+'" y="'+(y(P.VIB_OBS)+4)+'">Observar '+fN(P.VIB_OBS,1)+'</text><line class="ch-det" x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(P.VIB_DET)+'" y2="'+y(P.VIB_DET)+'"/><text class="ch-det-t" x="'+(W-mr+6)+'" y="'+(y(P.VIB_DET)+4)+'">Detener '+fN(P.VIB_DET,1)+"</text>";

const ETAPAS_R=["Corrugado","Impresión","Troquelado","Pegado","Inspección"];
function rng(seed){let x=seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296;};}
function historia(){
  const r=rng(20261014), dias=[1,2,5,6,7,8,9,13]; // 12-10 feriado; sábados y domingos sin operación
  return dias.map((d,i)=>{
    const f=i/(dias.length-1);
    const lotes=4+(r()<0.45?1:0), bloq=r()<0.2?1:0, desp=lotes-bloq;
    let ini=0;for(let k=0;k<desp;k++)ini+=Math.round((9000+r()*3500)/10)*10;
    const merma=(6.6-1.8*f+(r()-0.5)*1.0)/100, despC=Math.round(ini*(1-merma)), rech=ini-despC;
    const w=[0.07,0.17,0.43,0.18,0.15].map(x=>x*(0.8+r()*0.4)), ws=w.reduce((a,b)=>a+b,0);
    const porEtapa=w.map(x=>Math.round(rech*x/ws)); porEtapa[2]+=rech-porEtapa.reduce((a,b)=>a+b,0);
    const tarde=r()<0.2?1:0, obs=Math.floor(r()*3), det=r()<0.3?1:0, falsas=obs>0&&r()<0.25?1:0;
    const reg=lotes*7+Math.floor(r()*3), regErr=Math.floor(r()*3);
    return {fecha:new Date(2026,9,d).getTime(),lotes,desp,bloq,ini,despC,rech,porEtapa,ciclo:10.1-1.6*f+(r()-0.5)*0.8,comprometidos:lotes,aTiempo:desp-tarde,
      obs,det,falsas,resp:obs+det?Math.round(25+r()*30):null,detMin:Math.round(25+r()*55+det*40),reg,regOk:reg-regErr,manual:r()<0.3?1:0,humedad:r()<0.35?1:0,esperas:r()<0.3?1:0,
      reclamadas:Math.round(despC*(0.0005+r()*0.0006)),respRecl:Math.round(6+r()*22),sim:true};
  });
}

function mes(){
  const dias=historia().concat([hoy()]);
  const S=k=>dias.reduce((a,d)=>a+(d[k]||0),0);
  const m={dias,n:dias.length,lotes:S("lotes"),desp:S("desp"),bloq:S("bloq"),ini:S("ini"),despC:S("despC"),rech:S("rech"),obs:S("obs"),det:S("det"),falsas:S("falsas"),detMin:S("detMin"),reg:S("reg"),regOk:S("regOk"),manual:S("manual"),humedad:S("humedad"),esperas:S("esperas"),comprometidos:S("comprometidos"),aTiempo:S("aTiempo"),reclamadas:S("reclamadas")};
  m.recl=m.despC?m.reclamadas/m.despC*10000:null;
  const rrs=dias.filter(d=>d.respRecl!=null);m.respRecl=rrs.length?rrs.reduce((a,d)=>a+d.respRecl,0)/rrs.length:null;
  m.merma=m.ini?m.rech/m.ini*100:null;
  const dc=dias.filter(d=>d.ciclo!=null&&d.desp);m.ciclo=dc.reduce((a,d)=>a+d.ciclo*d.desp,0)/Math.max(1,dc.reduce((a,d)=>a+d.desp,0));
  m.otif=m.comprometidos?m.aTiempo/m.comprometidos*100:null;
  m.disp=(1-m.detMin/(m.n*16*60))*100;
  m.regPct=m.reg?m.regOk/m.reg*100:null;
  m.alertas=m.obs+m.det;m.falsasPct=m.alertas?m.falsas/m.alertas*100:0;
  const rr=dias.filter(d=>d.resp!=null);m.resp=rr.length?rr.reduce((a,d)=>a+d.resp,0)/rr.length:null;
  m.porEtapa=ETAPAS_R.map((et,i)=>({et,v:dias.reduce((a,d)=>a+d.porEtapa[i],0)})).sort((a,b)=>b.v-a.v);
  return m;
}

  S.fin=["Finanzas",'<div class="kpis">'+tile("Costo A+C año 1",mm(33.2e6),"dato del caso + "+mm(CAPACIT)+" de capacitación (supuesto) · tope $48 MM")+tile("Ahorro por menor merma",mm(ahorro),"en el período, frente a la línea base de 7,6 %")+tile("Costo de calidad",mm(costoCal),"reclamos, retenciones y detenciones del período","costo")+tile("Recuperación estimada",pay?fN(pay,1)+" meses":"—","solo con el ahorro por merma; ver Escenarios")+'</div><p class="small muted">Costos con supuestos de Finanzas: caja $'+fN(P.COSTO_CAJA)+", precio $"+fN(P.PRECIO_CAJA)+", hora de troqueladora detenida $"+fN(P.COSTO_HORA_PARADA)+", despacho extra $"+fN(P.COSTO_DESPACHO)+". El período tiene "+m.n+" días operados; la recuperación proyecta un mes de 22 días.</p>"];

  S.pareto=["¿Dónde se pierden las cajas? Rechazos por etapa",'<div class="tw"><table><thead><tr><th>Etapa</th><th>Cajas rechazadas</th><th>%</th><th>% acumulado</th><th></th></tr></thead><tbody>'+pareto+"</tbody></table></div>"];
  S.troq=["Troqueladora",'<div class="kpis">'+tile("Alertas confirmadas",fN(m.alertas),m.det+" de detener · "+m.obs+" de observar","ALERTA")+tile("Falsas alarmas",fP(m.falsasPct,0),m.falsas+" en el mes")+tile("Respuesta promedio",m.resp!=null?fN(m.resp)+" min":"—","de la alerta al cierre")+tile("Detenciones registradas",fN(m.detMin)+" min","en la troqueladora")+tile("Disponibilidad",fP(m.disp),"meta ≥ 94 %")+tile("Fallas de sensor",fN(cnt(x=>x.code==="SENSOR")),"lecturas sin dato válido","SENSOR")+"</div>"];

  S.detalle=["Detalle por día",'<div class="tw"><table><thead><tr><th>Día</th><th>Lotes</th><th>Desp.</th><th>Cajas desp.</th><th>Merma</th><th>Ciclo prom.</th><th>A tiempo</th><th>Alertas</th><th>Det. min</th><th>Reg. válidos</th><th>Cajas recl.</th></tr></thead><tbody>'+daily+"</tbody></table></div>"];

  S.concl=["Conclusiones y recomendaciones",'<div class="prose"><ul>'+k.c.map(x=>"<li>"+esc(x)+"</li>").join("")+(aud==="finanzas"||aud==="gerencia"?"<li>"+esc("El costo de calidad del período fue "+mm(costoCal)+" y el ahorro por menor merma, "+mm(ahorro)+". Con ese ahorro, la inversión se recuperaría en "+(pay?fN(pay,1)+" meses":"un plazo no estimable")+".")+"</li>":"")+'</ul><h4>Recomendaciones para el próximo mes</h4><ol>'+k.r.map(x=>"<li>"+esc(x)+"</li>").join("")+'</ol><p class="small muted">Generadas con reglas fijas a partir de los indicadores. El comité las revisa antes de decidir.</p></div>'];
  const secs=AUD_SEC[aud].map((key,i)=>"<section><h3>"+(i+1)+". "+S[key][0]+"</h3>"+S[key][1]+"</section>").join("");
  return '<div class="view-head"><span class="eyebrow">Se genera solo con los datos registrados</span><h2>Informe mensual · Octubre 2026 · '+AUD[aud].n+'</h2><p>Período: 1 al 14 de octubre ('+m.n+" días operados; el 12-10 fue feriado).</p></div>"+
  '<div class="field"><span class="eyebrow">Ver el informe como</span><div class="aud" role="group" aria-label="Tipo de informe">'+Object.keys(AUD).map(a=>'<button type="button" data-aud="'+a+'" aria-pressed="'+(a===aud)+'">'+AUD[a].n+"</button>").join("")+'</div><span class="hint">'+esc(AUD[aud].d)+"</span></div>"+

function copyInforme(){
  const m=mes(),k=conclusiones(m);
  const L=["Informe mensual de planta · AustralPack · Octubre 2026 (1 al 14)","Datos simulados para demostración.","",
    "Indicador\tLínea base\tMeta\tMes","Merma (scrap)\t"+fP(BASE.scrap)+"\t≤ "+META.scrap+" %\t"+fP(m.merma),"Tiempo de ciclo\t"+fN(BASE.ciclo,1)+" h\t≤ "+fN(META.ciclo,1)+" h\t"+fH(m.ciclo),
    "Entregas a tiempo\t"+BASE.otif+" %\t≥ "+META.otif+" %\t"+fP(m.otif),"Disponibilidad troqueladora\t"+BASE.disp+" %\t≥ "+META.disp+" %\t"+fP(m.disp),"Registros válidos\t—\t≥ "+st.params.REG_CONT+" %\t"+fP(m.regPct),"Reclamos por 10.000 cajas\t"+BASE.recl+"\t≤ "+META.recl+"\t"+fN(m.recl,1),"",
    "Día\tLotes\tDespachados\tCajas despachadas\tMerma %\tCiclo h\tA tiempo\tAlertas\tDetención min"];
  m.dias.forEach(d=>L.push([fD(d.fecha),d.lotes,d.desp,d.despC,fN(d.ini?d.rech/d.ini*100:null,1),fN(d.ciclo,1),d.aTiempo+"/"+d.comprometidos,d.obs+d.det,d.detMin].join("\t")));
  L.push("","Conclusiones");k.c.forEach(x=>L.push("- "+x));L.push("","Recomendaciones");k.r.forEach((x,i)=>L.push((i+1)+". "+x));
  const txt=L.join("\n");
  const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;ta.style.width="100%";ta.style.minHeight="200px";ta.setAttribute("aria-label","Informe para copiar");const w=document.querySelector("main .btn-row");if(w){w.after(ta);ta.focus();ta.select();}toast("Selecciona el texto y cópialo");};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Informe copiado: se puede pegar en Word o Excel"),fb);}catch(e){fb();}
}

function checkPin(id,pin){const u=USERS.find(x=>x.id===id);return !!u&&huella(id,String(pin||"").trim())===u.h;}

 reclamoNuevo:["calidad","gerencia"],params:["gerencia"],costos:["finanzas","gerencia"],reset:["gerencia"],vistoBueno:["gerencia","produccion"],bitacora:["gerencia"],
 ERROR:["operador","produccion"],SENSOR:["mantencion"],ALERTA:["mantencion"],BLOQUEO:["calidad"],RETENIDO:["calidad"],HUMEDAD:["calidad"],ESPERA:["produccion"],RECHAZO:["produccion","calidad"],RECLAMO:["calidad"],
 MISS:["operador","produccion"],HUM:["calidad"],RET:["calidad"],DET:["mantencion"],SEN:["mantencion"],ALT:["mantencion"],RCL:["calidad"]};
